<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Number Blaster" />
  <meta name="theme-color" content="#fff7ed" />
  <link rel="apple-touch-icon" href="rocket_book_logo.png" />
  <link rel="icon" type="image/png" href="rocket_book_logo.png" />
  <title>Number Blaster</title>
  <style>
    :root {
      --bg1: #fff7ed;
      --bg2: #fef3c7;
      --text: #172033;
      --muted: #5f6b85;
      --shadow: 0 18px 40px rgba(0,0,0,0.12);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      width: 100%; min-height: 100%; margin: 0; padding: 0;
      overflow-x: hidden; overflow-y: auto; touch-action: pan-y;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, Helvetica, sans-serif;
      color: var(--text);
      min-height: 100vh; min-height: 100dvh;
      display: flex; align-items: stretch; justify-content: center;
      padding-top: max(14px, env(safe-area-inset-top));
      padding-right: max(14px, env(safe-area-inset-right));
      padding-bottom: max(20px, env(safe-area-inset-bottom));
      padding-left: max(14px, env(safe-area-inset-left));
      user-select: none; -webkit-user-select: none;
      -webkit-text-size-adjust: 100%;
      overscroll-behavior-y: contain;
      background:
        radial-gradient(circle at top left,  rgba(251,191,36,0.26), transparent 28%),
        radial-gradient(circle at top right,  rgba(249,115,22,0.22), transparent 26%),
        radial-gradient(ellipse at 10% 96%,   rgba(250,204,21,0.28), transparent 46%),
        radial-gradient(ellipse at 90% 94%,   rgba(239,68,68,0.18),  transparent 44%),
        linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
    }

    .app, button, img { touch-action: manipulation; }

    .app {
      width: min(100%, 430px);
      background: rgba(255,255,255,0.93);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 32px;
      box-shadow: var(--shadow);
      padding: 20px 20px 28px 20px;
      display: flex; flex-direction: column;
      justify-content: flex-start; align-items: center;
      position: relative; overflow: hidden;
      border: 1px solid rgba(255,255,255,0.85);
    }

    /* ── Topbar ────────────────────────────────────────────────────── */
    .topbar {
      width: 100%; display: flex;
      justify-content: space-between; align-items: center;
      min-height: 36px; margin-bottom: 6px;
    }
    .progress-text { font-size: 16px; font-weight: 800; color: var(--muted); }
    .hearts-display { display: flex; gap: 3px; align-items: center; visibility: hidden; }
    .heart-icon { font-size: 22px; line-height: 1; transition: opacity 0.2s, filter 0.2s; }
    .heart-icon.lost { opacity: 0.22; filter: grayscale(1); }

    /* ── Screens ───────────────────────────────────────────────────── */
    .screen {
      display: none; flex-direction: column;
      align-items: center; justify-content: flex-start;
      width: 100%; text-align: center;
    }
    .screen.active { display: flex; }

    /* ── Shared typography ─────────────────────────────────────────── */
    .brand-logo {
      width: min(54vw, 88px); max-width: 88px; height: auto; margin-bottom: 4px;
    }
    .title {
      font-size: clamp(30px, 9vw, 44px); font-weight: 900;
      letter-spacing: -1px; line-height: 1.04; color: var(--text); margin-bottom: 2px;
    }
    .subtitle {
      font-size: 15px; font-weight: 700; color: var(--muted); margin-bottom: 14px;
    }

    /* ── Goal cards ────────────────────────────────────────────────── */
    .goal-list {
      width: 100%; display: flex; flex-direction: column; gap: 7px; margin-bottom: 14px;
    }
    .goal-card {
      width: 100%; border: 0; border-radius: 16px;
      padding: 11px 14px; cursor: pointer;
      display: flex; align-items: center; justify-content: space-between;
      transition: transform 0.1s ease, opacity 0.15s ease;
      box-shadow: 0 4px 14px rgba(0,0,0,0.11);
      font-family: inherit;
    }
    .goal-card:active { transform: scale(0.97); }
    .goal-card.locked { opacity: 0.42; cursor: default; }
    .goal-card-left { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; }
    .goal-card-label { font-size: 16px; font-weight: 900; color: #fff; letter-spacing: -0.3px; }
    .goal-card-sub   { font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.80); }
    .goal-card-badges { display: flex; gap: 5px; align-items: center; }

    .mode-badge {
      width: 30px; height: 30px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 900;
      background: rgba(255,255,255,0.18);
      color: rgba(255,255,255,0.42);
      border: 2px solid rgba(255,255,255,0.18);
    }
    .mode-badge.available {
      background: rgba(255,255,255,0.90);
      color: var(--text);
      border-color: transparent;
      box-shadow: 0 2px 6px rgba(0,0,0,0.13);
    }
    .mode-badge.done {
      background: rgba(255,255,255,0.30);
      color: rgba(255,255,255,0.95);
      border-color: rgba(255,255,255,0.55);
    }

    /* Per-goal gradient colors */
    .goal-1 { background: linear-gradient(135deg, #f87171 0%, #dc2626 100%); }
    .goal-2 { background: linear-gradient(135deg, #fb923c 0%, #ea580c 100%); }
    .goal-3 { background: linear-gradient(135deg, #facc15 0%, #b45309 100%); }
    .goal-4 { background: linear-gradient(135deg, #4ade80 0%, #15803d 100%); }
    .goal-5 { background: linear-gradient(135deg, #60a5fa 0%, #1d4ed8 100%); }
    .goal-6 { background: linear-gradient(135deg, #c084fc 0%, #7e22ce 100%); }
    .goal-7 { background: linear-gradient(115deg, #f87171 0%, #fb923c 25%, #facc15 50%, #4ade80 70%, #60a5fa 85%, #c084fc 100%); }

    /* ── Shared button styles ───────────────────────────────────────── */
    button {
      font-family: inherit; border: 0; border-radius: 20px; cursor: pointer;
      font-weight: 800; letter-spacing: -0.3px;
      transition: transform 0.08s ease, opacity 0.15s ease;
    }
    button:active { transform: scale(0.96); }

    .primary-btn {
      padding: 15px 28px; font-size: 17px; font-weight: 900;
      background: linear-gradient(180deg, #fbbf24 0%, #d97706 100%);
      color: #fff; box-shadow: 0 8px 20px rgba(217,119,6,0.30);
    }
    .neutral-btn {
      padding: 14px 28px; font-size: 16px; font-weight: 800;
      background: linear-gradient(180deg, #dbe2ea 0%, #c4ccd8 100%);
      color: #1f2937;
    }
    .segmented-actions {
      width: 260px; max-width: 100%;
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 0; border-radius: 22px; overflow: hidden;
      box-shadow: 0 10px 20px rgba(148,163,184,0.18);
      margin-top: 14px;
    }
    .segment-btn {
      border: 0; min-width: 0; border-radius: 0;
      padding: 15px 14px; font-size: 16px; font-weight: 800;
      cursor: pointer; transition: transform 0.08s ease; box-shadow: none;
    }
    .segment-btn:active { transform: scale(0.98); }
    .segment-left { border-right: 1px solid rgba(255,255,255,0.35); }

    .single-home-wrap { width: 100%; display: flex; justify-content: center; margin-top: 6px; }
    .single-home-btn  { width: 180px; max-width: 100%; }

    /* ── Problem display ────────────────────────────────────────────── */
    .problem-wrap {
      width: 100%; min-height: 130px;
      display: flex; align-items: center; justify-content: center;
      margin: 8px 0 0;
    }
    .problem-text {
      font-size: clamp(54px, 14vw, 82px); font-weight: 900;
      letter-spacing: -2px; color: var(--text); line-height: 1;
    }
    .problem-text .q-mark { color: #d97706; }
    .mode-tag {
      font-size: 14px; font-weight: 800; color: var(--muted);
      margin: 4px 0 10px; min-height: 18px;
    }

    /* ── Bubbles ────────────────────────────────────────────────────── */
    .bubbles-area {
      display: flex; gap: 14px;
      align-items: flex-end; justify-content: center;
      width: 100%; padding: 4px 0 18px;
    }
    .bubble {
      width: clamp(82px, 22vw, 104px);
      height: clamp(82px, 22vw, 104px);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: clamp(30px, 8vw, 40px); font-weight: 900;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(0,0,0,0.14);
      transition: transform 0.1s ease;
    }
    .bubble:active:not(.wrong):not(.correct) { transform: scale(0.92) !important; }

    @keyframes bob0 { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-11px)} }
    @keyframes bob1 { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-15px)} }
    @keyframes bob2 { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-9px)}  }
    .bubble-0 { animation: bob0 2.3s ease-in-out infinite;        }
    .bubble-1 { animation: bob1 2.7s ease-in-out infinite 0.45s;  }
    .bubble-2 { animation: bob2 3.0s ease-in-out infinite 0.85s;  }

    @keyframes shake {
      0%,100%{ transform:translateX(0) }
      20%{ transform:translateX(-8px) }
      40%{ transform:translateX(8px)  }
      60%{ transform:translateX(-5px) }
      80%{ transform:translateX(5px)  }
    }
    .bubble.wrong {
      animation: shake 0.38s ease !important;
      opacity: 0.30; pointer-events: none;
    }

    @keyframes burst {
      0%  { transform:scale(1);   opacity:1   }
      55% { transform:scale(1.55);opacity:0.6 }
      100%{ transform:scale(0.2); opacity:0   }
    }
    .bubble.correct { animation: burst 0.36s ease forwards !important; pointer-events: none; }

    /* ── Finish screen ──────────────────────────────────────────────── */
    .finish-accent  { font-size: clamp(52px, 14vw, 74px); margin-bottom: 4px; }
    .result-title   {
      font-size: clamp(28px, 8vw, 44px); font-weight: 900;
      margin-bottom: 8px; line-height: 1.04; color: var(--text);
    }
    .result-text    {
      font-size: 16px; line-height: 1.35; max-width: 300px;
      margin: 0 auto 10px; color: #243047;
    }
    .celebration-img {
      width: min(38vw, 140px); max-height: 140px; object-fit: cover;
      height: auto; border-radius: 22px; margin-top: 6px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.16); display: block;
    }
    .compact-buttons {
      margin-top: 14px; display: flex; flex-direction: column;
      align-items: center; gap: 12px; width: 100%;
    }

    /* ── Rotate overlay ─────────────────────────────────────────────── */
    .rotate-overlay {
      display: none; position: fixed; inset: 0;
      background: #172033; color: #fff; z-index: 99999;
      align-items: center; justify-content: center; flex-direction: column;
      text-align: center; padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    @media (orientation: landscape) { .rotate-overlay { display: flex; } }

    @media (max-width: 390px) {
      .problem-text { font-size: clamp(46px, 13vw, 68px); }
      .bubble { width: clamp(74px, 20vw, 90px); height: clamp(74px, 20vw, 90px); font-size: clamp(26px, 7vw, 34px); }
      .bubbles-area { gap: 10px; }
    }
  </style>
  <link rel="manifest" href="manifest.webmanifest?v=20260428a" />
  <link rel="stylesheet" href="mobile-fixes.css?v=20260428a" />
</head>
<body>
  <div class="app" id="app">

    <div class="topbar">
      <div class="progress-text" id="progressText"></div>
      <div class="hearts-display" id="heartsDisplay">
        <span class="heart-icon" id="heart0">❤️</span>
        <span class="heart-icon" id="heart1">❤️</span>
        <span class="heart-icon" id="heart2">❤️</span>
      </div>
    </div>

    <!-- ── Home / Goal select ───────────────────────────────────────── -->
    <div class="screen active" id="mathHomeScreen">
      <img src="rocket_book_logo.png" alt="Rocket Book" class="brand-logo" />
      <div class="title">Number Blaster</div>
      <div class="subtitle">Pick a goal and start blasting!</div>
      <div class="goal-list" id="goalList"></div>
      <div class="single-home-wrap">
        <button class="neutral-btn single-home-btn" id="mathBackBtn" type="button">Home</button>
      </div>
    </div>

    <!-- ── Game screen ──────────────────────────────────────────────── -->
    <div class="screen" id="mathGameScreen">
      <div class="problem-wrap">
        <div class="problem-text" id="problemText"></div>
      </div>
      <div class="mode-tag" id="modeTag"></div>
      <div class="bubbles-area" id="bubblesArea">
        <div class="bubble bubble-0" id="bubble0"></div>
        <div class="bubble bubble-1" id="bubble1"></div>
        <div class="bubble bubble-2" id="bubble2"></div>
      </div>
      <div class="single-home-wrap" style="margin-top:2px">
        <button class="neutral-btn single-home-btn" id="mathQuitBtn" type="button">Back to Goals</button>
      </div>
    </div>

    <!-- ── Finish / celebration ─────────────────────────────────────── -->
    <div class="screen" id="mathFinishScreen">
      <div class="finish-accent" id="finishAccent">🎉</div>
      <div class="result-title"  id="mathFinishTitle">Goal Complete!</div>
      <div class="result-text"   id="mathFinishText"></div>
      <img id="mathCelebrationImg" class="celebration-img" alt="Celebration" />
      <div class="compact-buttons" id="mathFinishButtons"></div>
    </div>

  </div><!-- .app -->

  <audio id="celebrationSound" preload="auto">
    <source src="celebration_sound.mp3" type="audio/mpeg" />
  </audio>

  <div class="rotate-overlay" aria-hidden="true">
    <div style="font-size:64px">📱</div>
    <div style="font-size:22px;font-weight:900;margin-top:16px">Please rotate your device</div>
    <div style="font-size:15px;margin-top:8px;opacity:0.7">Number Blaster works in portrait mode</div>
  </div>

  <div class="install-banner" id="installBanner">
    <button class="close-banner" onclick="document.getElementById('installBanner').style.display='none';localStorage.setItem('bannerDismissed','1')">&times;</button>
    Tap <b>Share &#x2191;</b> then <b>Add to Home Screen</b> for the best experience!
  </div>

  <script>
    try { screen.orientation.lock('portrait').catch(() => {}); } catch(e) {}

    // ── Seven Goals data (teacher's "Seven Goals for Addition/Subtraction") ──
    const GOALS_RAW = [
      {
        label: 'Goal 1', subtitle: 'Within 5s',
        add: [[1,3],[2,2],[3,1],[1,4],[2,3],[3,2],[4,1]],
        sub: [[4,1],[4,2],[4,3],[5,1],[5,2],[5,3],[5,4]]
      },
      {
        label: 'Goal 2', subtitle: 'Add on to 5s',
        add: [[5,1],[5,2],[5,3],[5,4],[5,5]],
        sub: [[6,1],[6,5],[7,2],[7,5],[8,3],[8,5],[9,4],[9,5],[10,5]]
      },
      {
        label: 'Goal 3', subtitle: 'Friendly Tens',
        add: [[0,10],[1,9],[2,8],[3,7],[4,6],[5,5]],
        sub: [[10,9],[10,8],[10,7],[10,6],[10,5],[10,4],[10,3],[10,2],[10,1],[10,0]]
      },
      {
        label: 'Goal 4', subtitle: 'Add on to 10s',
        add: [[10,1],[10,2],[10,3],[10,4],[10,5],[10,6],[10,7],[10,8],[10,9],[10,10]],
        sub: [[11,1],[11,10],[12,2],[12,10],[13,3],[13,10],[14,4],[14,10],[15,5],[15,10],
              [16,6],[16,10],[17,7],[17,10],[18,8],[18,10],[19,9],[19,10],[20,10]]
      },
      {
        label: 'Goal 5', subtitle: 'Doubles',
        add: [[3,3],[4,4],[5,5],[6,6],[7,7],[8,8],[9,9]],
        sub: [[6,3],[8,4],[12,6],[14,7],[16,8],[18,9]]
      },
      {
        label: 'Goal 6', subtitle: 'With 9s',
        add: [[2,9],[3,9],[4,9],[5,9],[6,9],[7,9],[8,9]],
        sub: [[11,2],[11,9],[12,3],[12,9],[13,4],[13,9],[14,5],[14,9],
              [15,6],[15,9],[16,7],[16,9],[17,8],[17,9]]
      },
      {
        label: 'Goal 7', subtitle: 'Mixed Review',
        add: null,
        sub: null
      }
    ];
    // Goal 7 = all facts from Goals 1–6 combined
    GOALS_RAW[6].add = GOALS_RAW.slice(0, 6).flatMap(g => g.add);
    GOALS_RAW[6].sub = GOALS_RAW.slice(0, 6).flatMap(g => g.sub);

    // ── Progress (localStorage) ──────────────────────────────────────
    const PROGRESS_KEY = 'nb_progress_v1';

    function getProgress() {
      try { return JSON.parse(localStorage.getItem(PROGRESS_KEY) || '{}'); } catch(e) { return {}; }
    }
    function saveProgress(p) {
      localStorage.setItem(PROGRESS_KEY, JSON.stringify(p));
    }
    function markModeDone(gIdx, mode) {
      const p = getProgress();
      if (!p[gIdx]) p[gIdx] = {};
      p[gIdx][mode] = true;
      saveProgress(p);
    }
    function isModeDone(gIdx, mode) {
      const p = getProgress();
      return !!(p[gIdx] && p[gIdx][mode]);
    }
    function isGoalUnlocked(gIdx) {
      if (gIdx === 0) return true;
      return isModeDone(gIdx - 1, 'add');
    }
    function getNextMode(gIdx) {
      if (!isModeDone(gIdx, 'add'))   return 'add';
      if (!isModeDone(gIdx, 'sub'))   return 'sub';
      if (!isModeDone(gIdx, 'champ')) return 'champ';
      return 'add'; // all done — loop back
    }

    // ── Game state ───────────────────────────────────────────────────
    let currentGoalIndex = 0;
    let currentMode      = '';
    let currentDeck      = [];
    let currentCardIndex = 0;
    let heartsLeft       = 3;
    let wrongThisProblem = 0;

    // ── DOM refs ─────────────────────────────────────────────────────
    const app             = document.getElementById('app');
    const progressText    = document.getElementById('progressText');
    const heartsDisplay   = document.getElementById('heartsDisplay');
    const goalListEl      = document.getElementById('goalList');
    const problemText     = document.getElementById('problemText');
    const modeTag         = document.getElementById('modeTag');
    const bubble0         = document.getElementById('bubble0');
    const bubble1         = document.getElementById('bubble1');
    const bubble2         = document.getElementById('bubble2');
    const celebSound      = document.getElementById('celebrationSound');
    const celebImg        = document.getElementById('mathCelebrationImg');
    const heartsEls       = [0,1,2].map(i => document.getElementById('heart'+i));

    const screens = {
      home:   document.getElementById('mathHomeScreen'),
      game:   document.getElementById('mathGameScreen'),
      finish: document.getElementById('mathFinishScreen')
    };

    // ── Screen control ───────────────────────────────────────────────
    function showScreen(key) {
      Object.values(screens).forEach(s => s.classList.remove('active'));
      screens[key].classList.add('active');
      heartsDisplay.style.visibility = key === 'game' ? 'visible' : 'hidden';
      if (key !== 'game') progressText.textContent = '';
      window.scrollTo({ top: 0, behavior: 'auto' });
    }

    // ── Hearts ───────────────────────────────────────────────────────
    function renderHearts() {
      heartsEls.forEach((el, i) => el.classList.toggle('lost', i >= heartsLeft));
    }
    function resetHearts() { heartsLeft = 3; renderHearts(); }
    function loseHeart() {
      if (heartsLeft > 0) heartsLeft--;
      renderHearts();
      if (heartsLeft === 0) {
        setTimeout(() => {
          resetHearts();
          currentDeck = shuffleArr(currentDeck);
          currentCardIndex = 0;
          wrongThisProblem = 0;
          showProblem();
        }, 700);
      }
    }

    // ── Giphy celebrations ───────────────────────────────────────────
    const GIPHY_KEY  = 'kIyJEsGiHN0LpmsNMaYm8SXyj4p2rZjm';
    const GIPHY_TAGS = ['great job animated cartoon','gold star cartoon','you did it animated',
                        'confetti celebration animated','thumbs up cartoon cute','hooray cartoon',
                        'super star animated sticker','well done animated cute'];
    let giphyCache = [];

    async function preloadGiphyCache() {
      try {
        const tag = GIPHY_TAGS[Math.floor(Math.random() * GIPHY_TAGS.length)];
        const url = `https://api.giphy.com/v1/stickers/search?api_key=${GIPHY_KEY}&q=${encodeURIComponent(tag)}&rating=g&limit=25&offset=${Math.floor(Math.random() * 50)}`;
        const data = await (await fetch(url)).json();
        if (data.data && data.data.length) giphyCache = data.data.map(g => g.images.fixed_height.url);
      } catch(e) {}
    }
    async function getRandomGif() {
      if (giphyCache.length > 0) {
        const gif = giphyCache.splice(Math.floor(Math.random() * giphyCache.length), 1)[0];
        if (giphyCache.length < 5) preloadGiphyCache();
        return gif;
      }
      try {
        const tag = GIPHY_TAGS[Math.floor(Math.random() * GIPHY_TAGS.length)];
        const url = `https://api.giphy.com/v1/stickers/random?api_key=${GIPHY_KEY}&tag=${encodeURIComponent(tag)}&rating=g`;
        const data = await (await fetch(url)).json();
        if (data.data && data.data.images) return data.data.images.fixed_height.url;
      } catch(e) {}
      return 'rocket_book_logo.png';
    }
    function playCelebSound() {
      if (!celebSound) return;
      celebSound.currentTime = 0; celebSound.volume = 0.85;
      celebSound.play().catch(() => {});
    }
    function stopCelebSound() {
      if (!celebSound) return;
      celebSound.pause(); celebSound.currentTime = 0;
    }

    // ── Web Audio chime ──────────────────────────────────────────────
    const CHIME_SRC = 'chime.m4a';
    let _wac = null, _chimeBuf = null;
    function _ensureWAC() {
      if (!_wac) try { _wac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
      return _wac;
    }
    async function _loadChimeBuf() {
      if (_chimeBuf) return;
      const ctx = _ensureWAC(); if (!ctx) return;
      try { _chimeBuf = await ctx.decodeAudioData(await (await fetch(CHIME_SRC)).arrayBuffer()); } catch(e) {}
    }
    const _chimeFb = Array.from({length:4}, () => { const a = new Audio(CHIME_SRC); a.preload='auto'; return a; });
    let _chimeFbIdx = 0;
    function playChime() {
      const ctx = _ensureWAC();
      if (ctx && (ctx.state==='suspended'||ctx.state==='interrupted')) ctx.resume();
      if (ctx && _chimeBuf) {
        try {
          const s = ctx.createBufferSource(), g = ctx.createGain();
          s.buffer = _chimeBuf; g.gain.value = 0.8;
          s.connect(g); g.connect(ctx.destination); s.start(0); return;
        } catch(e) {}
      }
      const a = _chimeFb[_chimeFbIdx++ % _chimeFb.length]; a.volume = 0.8; a.play().catch(()=>{});
    }
    document.addEventListener('touchstart', () => _loadChimeBuf(), {once:true, passive:true});

    // ── Helpers ──────────────────────────────────────────────────────
    function shuffleArr(arr) {
      const a = [...arr];
      for (let i = a.length-1; i > 0; i--) {
        const j = Math.floor(Math.random()*(i+1));
        [a[i],a[j]] = [a[j],a[i]];
      }
      return a;
    }

    function getChoices(correct) {
      const offsets = shuffleArr([-3,-2,-1,1,2,3,4,-4]);
      const pool = [];
      for (const off of offsets) {
        const d = correct + off;
        if (d >= 0 && d !== correct && !pool.includes(d)) { pool.push(d); if (pool.length === 2) break; }
      }
      // Fallback
      let d = correct+1;
      while (pool.length < 2) { if (d !== correct && !pool.includes(d)) pool.push(d); d++; }
      return shuffleArr([correct, ...pool]);
    }

    // ── Bubble colors ─────────────────────────────────────────────────
    const BUBBLE_THEMES = [
      { bg:'linear-gradient(135deg,#fbbf24,#f59e0b)', color:'#78350f' },
      { bg:'linear-gradient(135deg,#34d399,#059669)', color:'#022c22' },
      { bg:'linear-gradient(135deg,#60a5fa,#3b82f6)', color:'#1e3a8a' },
      { bg:'linear-gradient(135deg,#f472b6,#ec4899)', color:'#500724' },
      { bg:'linear-gradient(135deg,#a78bfa,#8b5cf6)', color:'#2e1065' },
      { bg:'linear-gradient(135deg,#fb923c,#f97316)', color:'#431407' },
    ];

    // ── Deck building ─────────────────────────────────────────────────
    function buildDeck(gIdx, mode) {
      const g = GOALS_RAW[gIdx];
      let facts = [];
      if (mode === 'add') {
        facts = g.add.map(([a,b]) => ({ q:`${a} + ${b}`, a:a+b }));
      } else if (mode === 'sub') {
        facts = g.sub.map(([a,b]) => ({ q:`${a} − ${b}`, a:a-b }));
      } else {
        const adds = g.add.map(([a,b]) => ({ q:`${a} + ${b}`, a:a+b }));
        const subs = g.sub.map(([a,b]) => ({ q:`${a} − ${b}`, a:a-b }));
        facts = shuffleArr([...adds, ...subs]);
      }
      return shuffleArr(facts);
    }

    // ── Show problem ──────────────────────────────────────────────────
    const bubbles = [bubble0, bubble1, bubble2];

    function showProblem() {
      const card = currentDeck[currentCardIndex];
      problemText.innerHTML = `${card.q} = <span class="q-mark">?</span>`;
      progressText.textContent = `${currentCardIndex + 1} of ${currentDeck.length}`;

      const modeLabels = { add:'➕ Addition', sub:'➖ Subtraction', champ:'⭐ Champion' };
      modeTag.textContent = `${GOALS_RAW[currentGoalIndex].label} — ${modeLabels[currentMode]}`;

      const choices = getChoices(card.a);
      const colors  = shuffleArr([...BUBBLE_THEMES]).slice(0, 3);

      bubbles.forEach((b, i) => {
        b.textContent           = choices[i];
        b.style.background      = colors[i].bg;
        b.style.color           = colors[i].color;
        b.dataset.val           = choices[i];
        b.className             = `bubble bubble-${i}`;
        b.style.opacity         = '';
        b.style.pointerEvents   = '';
      });

      wrongThisProblem = 0;
    }

    // ── Bubble tap ────────────────────────────────────────────────────
    function handleTap(bubble) {
      const selected = parseInt(bubble.dataset.val, 10);
      const correct  = currentDeck[currentCardIndex].a;

      if (selected === correct) {
        bubble.classList.add('correct');
        playChime();
        setTimeout(() => {
          currentCardIndex++;
          if (currentCardIndex >= currentDeck.length) {
            finishMode();
          } else {
            showProblem();
          }
        }, 400);
      } else {
        bubble.classList.add('wrong');
        wrongThisProblem++;
        if (wrongThisProblem >= 2) loseHeart();
      }
    }

    bubbles.forEach(b => b.addEventListener('click', () => handleTap(b)));

    // ── Start a goal mode ─────────────────────────────────────────────
    function startGoalMode(gIdx, mode) {
      stopCelebSound();
      currentGoalIndex = gIdx;
      currentMode      = mode;
      currentDeck      = buildDeck(gIdx, mode);
      currentCardIndex = 0;
      wrongThisProblem = 0;
      resetHearts();
      showScreen('game');
      showProblem();
      _loadChimeBuf();
    }

    // ── Finish a mode ─────────────────────────────────────────────────
    const MODE_META = {
      add:   { emoji:'➕', title:'Addition Blasted!',    text:'You nailed the addition facts! Ready to try subtraction with the same numbers?' },
      sub:   { emoji:'➖', title:'Subtraction Blasted!', text:'Incredible! You know both addition AND subtraction. Now try Champion mode — everything mixed up!' },
      champ: { emoji:'⭐', title:'Goal Complete!',       text:"You're a Math Champion! Unlock the next goal to keep going!" }
    };

    function finishMode() {
      markModeDone(currentGoalIndex, currentMode);

      const meta = MODE_META[currentMode];
      document.getElementById('finishAccent').textContent     = meta.emoji;
      document.getElementById('mathFinishTitle').textContent  = meta.title;
      document.getElementById('mathFinishText').textContent   = meta.text;

      // Build finish buttons
      const btns = document.getElementById('mathFinishButtons');
      btns.innerHTML = '';
      const pill = document.createElement('div');
      pill.className = 'segmented-actions';

      const goalsBtn = document.createElement('button');
      goalsBtn.type = 'button';
      goalsBtn.className = 'neutral-btn segment-btn segment-left';
      goalsBtn.textContent = 'Goals';
      goalsBtn.addEventListener('click', () => { stopCelebSound(); buildGoalList(); showScreen('home'); });

      const nextBtn = document.createElement('button');
      nextBtn.type = 'button';
      nextBtn.className = 'primary-btn segment-btn';

      const allDone = ['add','sub','champ'].every(m => isModeDone(currentGoalIndex, m));
      const nextGIdx = currentGoalIndex + 1;
      const nextMode = getNextMode(currentGoalIndex);
      const modeLabels = { add:'➕ Add', sub:'➖ Sub', champ:'⭐ Champ' };

      if (!allDone) {
        nextBtn.textContent = `Next: ${modeLabels[nextMode]}`;
        nextBtn.addEventListener('click', () => { stopCelebSound(); startGoalMode(currentGoalIndex, nextMode); });
      } else if (nextGIdx < GOALS_RAW.length && isGoalUnlocked(nextGIdx)) {
        nextBtn.textContent = `${GOALS_RAW[nextGIdx].label} →`;
        nextBtn.addEventListener('click', () => { stopCelebSound(); startGoalMode(nextGIdx, getNextMode(nextGIdx)); });
      } else {
        nextBtn.textContent = 'Play Again';
        nextBtn.addEventListener('click', () => { stopCelebSound(); startGoalMode(currentGoalIndex, currentMode); });
      }

      pill.appendChild(goalsBtn);
      pill.appendChild(nextBtn);
      btns.appendChild(pill);

      // Celebration
      celebImg.removeAttribute('src');
      getRandomGif().then(src => { celebImg.src = src; });
      playCelebSound();
      showScreen('finish');
    }

    // ── Goal list ─────────────────────────────────────────────────────
    function buildGoalList() {
      goalListEl.innerHTML = '';
      GOALS_RAW.forEach((goal, i) => {
        const unlocked  = isGoalUnlocked(i);
        const addDone   = isModeDone(i, 'add');
        const subDone   = isModeDone(i, 'sub');
        const champDone = isModeDone(i, 'champ');

        const card = document.createElement('button');
        card.type = 'button';
        card.className = `goal-card goal-${i+1}${unlocked ? '' : ' locked'}`;

        const left = document.createElement('div');
        left.className = 'goal-card-left';
        const lbl = document.createElement('div');
        lbl.className = 'goal-card-label';
        lbl.textContent = unlocked ? goal.label : `🔒 ${goal.label}`;
        const sub = document.createElement('div');
        sub.className = 'goal-card-sub';
        sub.textContent = goal.subtitle;
        left.appendChild(lbl);
        left.appendChild(sub);

        const badges = document.createElement('div');
        badges.className = 'goal-card-badges';
        [
          { done: addDone,   avail: unlocked,               sym: '＋' },
          { done: subDone,   avail: unlocked && addDone,    sym: '－' },
          { done: champDone, avail: unlocked && addDone && subDone, sym: '★' }
        ].forEach(({ done, avail, sym }) => {
          const b = document.createElement('div');
          b.className = 'mode-badge' + (done ? ' done' : avail ? ' available' : '');
          b.textContent = done ? '✓' : sym;
          badges.appendChild(b);
        });

        card.appendChild(left);
        card.appendChild(badges);

        card.addEventListener('click', () => {
          if (!unlocked) {
            card.style.transform = 'scale(0.96)';
            setTimeout(() => { card.style.transform = ''; }, 180);
            return;
          }
          startGoalMode(i, getNextMode(i));
        });

        goalListEl.appendChild(card);
      });
    }

    // ── Nav ───────────────────────────────────────────────────────────
    document.getElementById('mathBackBtn').addEventListener('click', () => {
      stopCelebSound();
      window.location.href = 'index.html';
    });
    document.getElementById('mathQuitBtn').addEventListener('click', () => {
      stopCelebSound();
      buildGoalList();
      showScreen('home');
    });

    // ── Init ──────────────────────────────────────────────────────────
    preloadGiphyCache();
    buildGoalList();

    document.addEventListener('touchmove', e => {
      if (!e.target.closest('.scrollable')) e.preventDefault();
    }, { passive: false });
    document.addEventListener('gesturestart',  e => e.preventDefault());
    document.addEventListener('gesturechange', e => e.preventDefault());

    if (/iPhone|iPad/.test(navigator.userAgent) && !window.navigator.standalone && !localStorage.getItem('bannerDismissed')) {
      setTimeout(() => { const b = document.getElementById('installBanner'); if (b) b.style.display = 'block'; }, 2000);
    }
  </script>
