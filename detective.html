<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#120800" />
  <link rel="apple-touch-icon" href="rocket_book_logo.png?v=12" />
  <title>Digit Detective</title>
  <style>
    :root {
      --bg:    #120800;
      --gold:  #f5c518;
      --gold2: #c9a012;
      --text:  #f5ead8;
      --muted: rgba(245,234,216,0.60);
      --ok:    #22c55e;
      --bad:   #ef4444;
      --lo-r:  78px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      width: 100%; height: 100dvh; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -webkit-user-select: none; user-select: none;
    }

    /* ── Full-screen background image ───────────────── */
    #bgLayer {
      position: fixed; inset: 0; z-index: 0;
      background: var(--bg);
    }
    #bgLayer img {
      width: 100%; height: 100%;
      object-fit: cover;
      opacity: 0.75;
      display: block;
    }

    /* ── Screens ────────────────────────────────────── */
    .screen {
      display: none; flex-direction: column; align-items: center;
      position: absolute; inset: 0; z-index: 10;
    }
    .screen.active { display: flex; }

    /* ── Back button ────────────────────────────────── */
    .back-btn {
      position: absolute;
      top: max(14px, env(safe-area-inset-top));
      left: 14px;
      background: rgba(245,197,24,0.13);
      border: 1px solid rgba(245,197,24,0.28);
      border-radius: 50px; padding: 7px 14px 7px 10px;
      color: var(--muted); font-size: 14px; font-weight: 700;
      cursor: pointer; font-family: inherit;
      display: flex; align-items: center; gap: 6px; z-index: 20;
    }
    .back-btn:active { background: rgba(245,197,24,0.24); }

    /* ── Mute button ────────────────────────────────── */
    #muteBtn {
      position: absolute;
      top: max(14px, env(safe-area-inset-top));
      right: 14px;
      background: rgba(245,197,24,0.13);
      border: 1px solid rgba(245,197,24,0.28);
      border-radius: 50%;
      width: 36px; height: 36px;
      font-size: 16px;
      cursor: pointer; font-family: inherit;
      display: flex; align-items: center; justify-content: center;
      z-index: 20;
    }
    #muteBtn:active { background: rgba(245,197,24,0.24); }

    /* ═══ HOME ═══════════════════════════════════════ */
    #screenHome { justify-content: center; }
    .home-badge {
      width: 120px; height: 120px; border-radius: 30px;
      background: linear-gradient(145deg, #f5c518, #c9a012);
      display: flex; align-items: center; justify-content: center;
      font-size: 64px; margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.60), 0 0 40px rgba(245,197,24,0.20);
    }
    .home-title { font-size: clamp(30px,8vw,40px); font-weight: 900; text-align: center; line-height: 1.1; margin-bottom: 8px; color: var(--gold); text-shadow: 0 2px 12px rgba(0,0,0,0.60); }
    .home-sub   { font-size: 15px; color: var(--muted); font-weight: 600; text-align: center; margin-bottom: 44px; line-height: 1.45; max-width: 270px; text-shadow: 0 1px 6px rgba(0,0,0,0.70); }
    .start-btn  {
      background: linear-gradient(135deg, #f5c518, #c9a012);
      color: #160c04; border: none; border-radius: 18px;
      padding: 18px 46px; font-size: 19px; font-weight: 900;
      font-family: inherit; cursor: pointer;
      box-shadow: 0 6px 24px rgba(0,0,0,0.50), 0 0 20px rgba(245,197,24,0.25);
    }
    .start-btn:active { transform: scale(0.96); }

    /* ═══ GAME SCREEN ════════════════════════════════ */
    #screenGame {
      justify-content: flex-start;
      align-items: center;
      padding-top:   max(calc(env(safe-area-inset-top) + 54px), 68px);
      padding-left:  max(20px, env(safe-area-inset-left));
      padding-right: max(20px, env(safe-area-inset-right));
      padding-bottom: max(calc(env(safe-area-inset-bottom) + 90px), 100px);
      gap: 8px;
    }

    /* Progress dots */
    .prog-row { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; }
    .prog-dot { width: 9px; height: 9px; border-radius: 50%; background: rgba(245,197,24,0.20); transition: background 0.2s; }
    .prog-dot.done-ok  { background: var(--ok); }
    .prog-dot.done-bad { background: rgba(239,68,68,0.60); }
    .prog-dot.current  { background: var(--gold); }

    /* Case label */
    .case-label { font-size: 11px; font-weight: 800; letter-spacing: 0.12em; color: var(--gold); text-transform: uppercase; opacity: 0.9; text-shadow: 0 1px 6px rgba(0,0,0,0.70); }

    /* ── Case File card ─────────────────────────────── */
    .case-card {
      width: 100%;
      max-width: 300px;
      background: #f9f5e8;
      border: 2px solid rgba(245,197,24,0.70);
      border-radius: 20px;
      padding: 24px 20px 20px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.60), 0 2px 0 rgba(245,197,24,0.30);
      transition: border-color 0.25s, box-shadow 0.25s;
      flex-shrink: 0;
    }
    .case-card.glow-snap {
      border-color: rgba(245,197,24,1);
      box-shadow: 0 8px 40px rgba(0,0,0,0.60), 0 0 28px rgba(245,197,24,0.50);
    }
    .card-case-label {
      font-size: 10px; font-weight: 900; letter-spacing: 0.14em;
      color: #c9a012; text-transform: uppercase;
      text-align: center; margin-bottom: 14px; opacity: 0.8;
    }

    /* ── Vertical equation ──────────────────────────── */
    .v-eq {
      display: flex; flex-direction: column;
      align-items: flex-end;
      gap: 0; width: 100%;
    }
    .v-row {
      display: flex; align-items: center;
      width: 100%;
      min-height: clamp(68px, 16vw, 86px);
    }
    .v-op {
      font-size: clamp(28px, 7vw, 40px);
      font-weight: 500; color: #8a5030;
      width: 40px; text-align: center; flex-shrink: 0;
    }
    .v-num {
      font-size: clamp(54px, 13vw, 72px);
      font-weight: 900; color: #2a1505;
      flex: 1; text-align: right; line-height: 1;
    }
    .v-line {
      width: 100%; height: 3px;
      background: #2a1505; border-radius: 2px;
      margin: 4px 0 2px;
    }

    /* Sum row: same layout as v-row so number aligns perfectly */
    #rowSum { min-height: clamp(68px, 16vw, 86px); }

    /* vSum holds the fingerprint image and the revealed number */
    #vSum {
      position: relative;
      display: flex; align-items: center; justify-content: flex-end;
    }
    #fpImg {
      position: absolute; right: 0;
      height: 0.82em; width: auto;
      object-fit: contain;
      transition: opacity 0.30s;
    }
    #blankVal {
      opacity: 0;
      transition: opacity 0.30s;
      position: relative; z-index: 1;
      line-height: 1;
    }
    #blankVal.show { opacity: 1; }

    /* Hint + feedback */
    .drag-hint {
      font-size: 14px; color: rgba(245,197,24,0.90); font-weight: 700;
      letter-spacing: 0.04em; text-align: center;
      animation: hintFade 2s ease-in-out infinite;
      min-height: 20px;
      text-shadow: 0 1px 6px rgba(0,0,0,0.70);
    }
    @keyframes hintFade { 0%,100%{opacity:0.9;} 50%{opacity:0.28;} }

    .feedback-msg {
      font-size: 16px; font-weight: 800; text-align: center;
      min-height: 24px; letter-spacing: 0.02em;
      text-shadow: 0 1px 6px rgba(0,0,0,0.60);
    }
    .feedback-msg.ok  { color: var(--ok); }
    .feedback-msg.bad { color: var(--bad); }

    @keyframes flashOk  { 0%,100%{background:#f9f5e8;} 50%{background:#d4f5df;} }
    @keyframes flashBad { 0%,100%{background:#f9f5e8;} 30%,70%{background:#fdd;} }
    .case-card.flash-ok  { animation: flashOk  0.45s ease; }
    .case-card.flash-bad { animation: flashBad 0.40s ease; }

    /* Submit */
    #submitBtn {
      position: fixed;
      left:   max(16px, env(safe-area-inset-left));
      right:  max(16px, env(safe-area-inset-right));
      bottom: max(calc(env(safe-area-inset-bottom) + 14px), 20px);
      background: linear-gradient(135deg, #f5c518, #c9a012);
      color: #160c04; border: none; border-radius: 16px;
      padding: 17px; font-size: 17px; font-weight: 900;
      font-family: inherit; cursor: pointer;
      box-shadow: 0 4px 20px rgba(0,0,0,0.50);
      opacity: 0.28; pointer-events: none;
      transition: opacity 0.22s;
      z-index: 250;
    }
    #submitBtn.active { opacity: 1; pointer-events: auto; }
    #submitBtn.active:active { transform: scale(0.97); }

    /* ═══ MAGNIFIER ══════════════════════════════════ */
    #magnifier {
      position: fixed;
      width: min(260px, 67vw);
      z-index: 200;
      touch-action: none;
      cursor: grab;
    }
    #magnifier.dragging { cursor: grabbing; }

    #magImg {
      width: 100%; display: block;
      position: relative; z-index: 2;
      pointer-events: none;
      filter: drop-shadow(0 12px 32px rgba(0,0,0,0.75));
    }

    /* Lens overlay: dark while idle, fades to transparent on snap */
    #lensOverlay {
      position: absolute;
      left: calc(50% - var(--lo-r));
      top:  calc(33.5% - var(--lo-r));
      width:  calc(var(--lo-r) * 2);
      height: calc(var(--lo-r) * 2);
      border-radius: 50%;
      overflow: hidden;
      background: rgba(10, 5, 1, 0.88);
      transition: background 0.30s;
      z-index: 1;
      isolation: isolate;
    }

    /* Search icon when idle */
    #lensIdle {
      position: absolute; inset: 0; z-index: 20;
      display: flex; align-items: center; justify-content: center;
      font-size: 56px;
      transition: opacity 0.22s;
    }

    /* Picker: hidden when snapped (lens is transparent) */
    #pickerVp { position: absolute; inset: 0; overflow: hidden; z-index: 1; transition: opacity 0.25s; }
    #pickerList { position: absolute; left: 0; right: 0; top: 0; will-change: transform; }
    .p-item {
      height: 50px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: 700;
      color: rgba(245,234,216,0.28);
      user-select: none;
    }
    .p-item.sel { color: var(--gold); font-size: 40px; font-weight: 900; }

    #selBar {
      position: absolute; left: 0; right: 0;
      top: calc(var(--lo-r) - 25px);
      height: 50px;
      border-top:    1.5px solid rgba(245,197,24,0.55);
      border-bottom: 1.5px solid rgba(245,197,24,0.55);
      background: rgba(245,197,24,0.07);
      pointer-events: none; z-index: 10;
      transition: opacity 0.25s;
    }
    .p-fade { position: absolute; left: 0; right: 0; height: 46px; pointer-events: none; z-index: 9; transition: opacity 0.25s; }
    .p-fade.top    { top: 0;    background: linear-gradient(to bottom, rgba(10,5,1,0.92), transparent); }
    .p-fade.bottom { bottom: 0; background: linear-gradient(to top,   rgba(10,5,1,0.92), transparent); }

    @keyframes magShake {
      0%,100%{transform:translateX(0);}
      20%{transform:translateX(-10px);}
      40%{transform:translateX(10px);}
      60%{transform:translateX(-6px);}
      80%{transform:translateX(6px);}
    }
    #magnifier.shake { animation: magShake 0.40s ease; }

    /* ═══ FINISH ═════════════════════════════════════ */
    #screenFinish { justify-content: center; }
    .finish-icon  { font-size: 72px; margin-bottom: 14px; }
    .finish-title { font-size: 28px; font-weight: 900; color: var(--gold); text-align: center; margin-bottom: 6px; text-shadow: 0 2px 12px rgba(0,0,0,0.70); }
    .finish-score {
      font-size: 15px; color: var(--muted); font-weight: 600; text-align: center;
      margin-bottom: 38px; line-height: 1.5; max-width: 264px; white-space: pre-line;
      text-shadow: 0 1px 6px rgba(0,0,0,0.70);
    }
    .replay-btn {
      background: linear-gradient(135deg, #f5c518, #c9a012);
      color: #160c04; border: none; border-radius: 16px;
      padding: 15px 40px; font-size: 17px; font-weight: 900;
      font-family: inherit; cursor: pointer;
      box-shadow: 0 4px 18px rgba(0,0,0,0.50);
    }
    .replay-btn:active { transform: scale(0.97); }

    /* ═══ LANDSCAPE ══════════════════════════════════ */
    @media (orientation: landscape) {
      #screenGame {
        padding-top:    max(calc(env(safe-area-inset-top) + 8px), 14px);
        padding-bottom: max(calc(env(safe-area-inset-bottom) + 68px), 76px);
        gap: 4px;
      }
      .case-card {
        padding: 10px 16px 10px;
        max-width: 360px;
      }
      .card-case-label { margin-bottom: 8px; }
      .v-row, #rowSum { min-height: clamp(48px, 11vh, 62px); }
      .v-num { font-size: clamp(38px, 9vh, 52px); }
      .v-op  { font-size: clamp(22px, 5vh, 30px); width: 32px; }
      .v-line { margin: 2px 0 1px; }
      #submitBtn {
        padding: 13px;
        bottom: max(calc(env(safe-area-inset-bottom) + 8px), 12px);
      }
    }
  </style>
</head>
<body>

<audio id="bgMusic" src="Digit_Detective_Beat.mp3" loop preload="auto"></audio>

<!-- Background image layer -->
<div id="bgLayer">
  <img src="Digit_Detective_Background.png" alt="">
</div>

<!-- HOME -->
<div class="screen active" id="screenHome">
  <div class="home-badge">🕵️</div>
  <div class="home-title">Digit Detective</div>
  <div class="home-sub">Drag the magnifying glass up to the mystery number to crack the case!</div>
  <button class="start-btn" onclick="startGame()" type="button">Open Case File</button>
</div>

<!-- GAME -->
<div class="screen" id="screenGame">
  <button class="back-btn" onclick="goHome()" type="button">
    <svg width="8" height="14" viewBox="0 0 8 14" fill="none"><path d="M7 1L1 7L7 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Home
  </button>
  <button id="muteBtn" onclick="toggleMute()" type="button" title="Toggle music">🔊</button>

  <div class="prog-row" id="progRow"></div>
  <div class="case-label" id="caseLabel">Case #1 of 10</div>

  <div class="case-card" id="caseCard">
    <div class="card-case-label" id="cardCaseLabel">Case #1</div>

    <div class="v-eq">
      <div class="v-row">
        <div class="v-op"></div>
        <div class="v-num" id="vLeft">—</div>
      </div>
      <div class="v-row">
        <div class="v-op">+</div>
        <div class="v-num" id="vRight">—</div>
      </div>
      <div class="v-line"></div>
      <!-- Sum row mirrors v-row so number aligns with addends above -->
      <div class="v-row" id="rowSum">
        <div class="v-op"></div>
        <div class="v-num" id="vSum">
          <img src="Finger_Print.png" id="fpImg" alt="?">
          <span id="blankVal"></span>
        </div>
      </div>
    </div>
  </div>

  <div class="drag-hint" id="dragHint">drag 🔍 up to the mystery number</div>
  <div class="feedback-msg" id="feedbackMsg">&nbsp;</div>
</div>

<!-- FINISH -->
<div class="screen" id="screenFinish">
  <button class="back-btn" onclick="goHome()" type="button">
    <svg width="8" height="14" viewBox="0 0 8 14" fill="none"><path d="M7 1L1 7L7 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Home
  </button>
  <div class="finish-icon"  id="finishIcon">🏆</div>
  <div class="finish-title" id="finishTitle">Case Closed!</div>
  <div class="finish-score" id="finishScore"></div>
  <button class="replay-btn" onclick="startGame()" type="button">New Case File</button>
</div>

<!-- Submit -->
<button id="submitBtn" style="display:none" onclick="submitAnswer()" type="button">
  🔍 Case Solved!
</button>

<!-- MAGNIFIER -->
<div id="magnifier" style="display:none">
  <div id="lensOverlay">
    <div id="lensIdle">🔍</div>
    <div id="pickerVp">
      <div id="pickerList"></div>
    </div>
    <div id="selBar"></div>
    <div class="p-fade top"></div>
    <div class="p-fade bottom"></div>
  </div>
  <img id="magImg" src="Magnifying_Glass_v1.png" alt="" />
</div>

<script>
  try { screen.orientation.lock('portrait').catch(()=>{}); } catch(e) {}

  // ── Audio ─────────────────────────────────────────────────────
  const bgMusic = document.getElementById('bgMusic');
  let muted = false;
  function toggleMute() {
    muted = !muted;
    bgMusic.muted = muted;
    document.getElementById('muteBtn').textContent = muted ? '🔇' : '🔊';
  }

  // ── Problems ──────────────────────────────────────────────────
  const ALL_PROBLEMS = [
    { total:11, left:5,  right:6  },
    { total:12, left:3,  right:9  },
    { total:12, left:7,  right:5  },
    { total:14, left:5,  right:9  },
    { total:14, left:8,  right:6  },
    { total:15, left:5,  right:10 },
    { total:16, left:7,  right:9  },
    { total:17, left:8,  right:9  },
    { total:18, left:8,  right:10 },
    { total:18, left:9,  right:9  },
  ];

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // ── DOM refs ──────────────────────────────────────────────────
  const magnifier  = document.getElementById('magnifier');
  const magImg     = document.getElementById('magImg');
  const lensOverlay= document.getElementById('lensOverlay');
  const lensIdle   = document.getElementById('lensIdle');
  const pickerVp   = document.getElementById('pickerVp');
  const selBar     = document.getElementById('selBar');
  const pickerList = document.getElementById('pickerList');
  const caseCard   = document.getElementById('caseCard');
  const dragHint   = document.getElementById('dragHint');
  const feedbackMsg= document.getElementById('feedbackMsg');
  const submitBtn  = document.getElementById('submitBtn');
  const fpImg      = document.getElementById('fpImg');
  const blankVal   = document.getElementById('blankVal');
  const vSum       = document.getElementById('vSum');
  const pFades     = document.querySelectorAll('.p-fade');

  // ── Magnifier geometry ────────────────────────────────────────
  let LENS_OX = 130, LENS_OY = 108, MAG_H = 321;
  function updateLensGeometry() {
    const w = magnifier.offsetWidth, h = magnifier.offsetHeight;
    if (h > 0) { LENS_OX = w * 0.50; LENS_OY = h * 0.335; MAG_H = h; }
  }

  magImg.addEventListener('load', () => { updateLensGeometry(); if (gameActive) positionMagHome(false); });
  window.addEventListener('resize', () => { updateLensGeometry(); if (gameActive) positionMagHome(false); });

  // ── Magnifier position ────────────────────────────────────────
  let magCX = 0, magCY = 0, gameActive = false;

  function getHomePos() {
    updateLensGeometry();
    const bc = getBlankCenter();
    if (bc && bc.y > 100) return { x: window.innerWidth / 2, y: bc.y + 160 };
    return { x: window.innerWidth / 2, y: window.innerHeight * 0.78 };
  }

  function setMagPos(cx, cy, animate) {
    magCX = cx; magCY = cy;
    magnifier.style.transition = animate
      ? 'left 0.38s cubic-bezier(0.34,1.56,0.64,1), top 0.38s cubic-bezier(0.34,1.56,0.64,1)'
      : 'none';
    magnifier.style.left = (cx - LENS_OX) + 'px';
    magnifier.style.top  = (cy - LENS_OY) + 'px';
  }

  function positionMagHome(animate) {
    requestAnimationFrame(() => { const p = getHomePos(); setMagPos(p.x, p.y, animate); });
  }

  // ── State machine: idle / dragging / snapped / picking ────────
  let state = 'idle', dragOffX = 0, dragOffY = 0;

  // ── Picker ────────────────────────────────────────────────────
  const ITEM_H = 50, MIN_V = 0, MAX_V = 20, CENTER_OFF = 53;
  let pickerVal = 5, pickerOff = 0;
  let pickStartY = 0, pickStartOff = 0, pickVel = 0, pickLastY = 0, pickLastT = 0;

  function offsetForVal(v) { return CENTER_OFF - v * ITEM_H; }
  function valForOffset(o) { return Math.round((CENTER_OFF - o) / ITEM_H); }
  function clampOff(o)     { return Math.max(offsetForVal(MAX_V), Math.min(offsetForVal(MIN_V), o)); }

  function applyPickerOffset(o, snap) {
    o = clampOff(o);
    pickerOff = o;
    pickerList.style.transition = snap ? 'transform 0.22s cubic-bezier(0.25,1,0.5,1)' : 'none';
    pickerList.style.transform  = 'translateY(' + o + 'px)';
    const v = Math.max(MIN_V, Math.min(MAX_V, valForOffset(o)));
    pickerVal = v;
    pickerList.querySelectorAll('.p-item').forEach(el => el.classList.toggle('sel', +el.dataset.v === v));
    blankVal.textContent = v;
  }

  function buildPickerItems() {
    pickerList.innerHTML = '';
    for (let i = MIN_V; i <= MAX_V; i++) {
      const d = document.createElement('div');
      d.className = 'p-item'; d.dataset.v = i; d.textContent = i;
      pickerList.appendChild(d);
    }
  }

  // ── Blank center (now measured on vSum element) ───────────────
  function getBlankCenter() {
    const r = vSum.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }

  // ── Snap / unsnap ─────────────────────────────────────────────
  const SNAP_DIST = 110;

  function setLensSnapped(snapped) {
    if (snapped) {
      lensOverlay.style.background = 'transparent';
      lensIdle.style.opacity = '0';
      pickerVp.style.opacity = '0';
      selBar.style.opacity = '0';
      pFades.forEach(el => el.style.opacity = '0');
      fpImg.style.opacity = '0';
      blankVal.classList.add('show');
    } else {
      lensOverlay.style.background = '';
      lensIdle.style.opacity = '1';
      pickerVp.style.opacity = '1';
      selBar.style.opacity = '1';
      pFades.forEach(el => el.style.opacity = '1');
      fpImg.style.opacity = '1';
      blankVal.classList.remove('show');
    }
  }

  function snapMagnifier(bc) {
    setMagPos(bc.x, bc.y, true);
    state = 'snapped';
    setTimeout(() => {
      setLensSnapped(true);
      dragHint.style.display = 'none';
      submitBtn.classList.add('active');
    }, 260);
  }

  function unsnap(animate) {
    state = 'idle';
    setLensSnapped(false);
    dragHint.style.display = '';
    submitBtn.classList.remove('active');
    positionMagHome(animate);
  }

  // ── Pointer events on magnifier ───────────────────────────────
  magnifier.addEventListener('pointerdown', e => {
    e.preventDefault();
    magnifier.setPointerCapture(e.pointerId);
    if (state === 'snapped' || state === 'picking') {
      state = 'picking';
      pickStartY = e.clientY; pickStartOff = pickerOff;
      pickVel = 0; pickLastY = e.clientY; pickLastT = Date.now();
    } else if (state === 'idle') {
      state = 'dragging';
      magnifier.classList.add('dragging');
      dragOffX = e.clientX - magCX; dragOffY = e.clientY - magCY;
    }
  });

  magnifier.addEventListener('pointermove', e => {
    if (state === 'dragging') {
      const cx = e.clientX - dragOffX, cy = e.clientY - dragOffY;
      setMagPos(cx, cy, false);
      const bc = getBlankCenter();
      if (bc) caseCard.classList.toggle('glow-snap', Math.hypot(cx - bc.x, cy - bc.y) < SNAP_DIST + 40);
    } else if (state === 'picking') {
      const dy = e.clientY - pickStartY;
      applyPickerOffset(pickStartOff + dy, false);
      const now = Date.now(), dt = now - pickLastT;
      if (dt > 0) pickVel = (e.clientY - pickLastY) / dt;
      pickLastY = e.clientY; pickLastT = now;
    }
  });

  magnifier.addEventListener('pointerup', e => {
    if (state === 'dragging') {
      magnifier.classList.remove('dragging');
      caseCard.classList.remove('glow-snap');
      const bc = getBlankCenter();
      if (bc && Math.hypot(magCX - bc.x, magCY - bc.y) < SNAP_DIST) { snapMagnifier(bc); return; }
      state = 'idle';
      positionMagHome(true);
    } else if (state === 'picking') {
      const projected = pickerOff + pickVel * 90;
      const v = Math.max(MIN_V, Math.min(MAX_V, Math.round((CENTER_OFF - projected) / ITEM_H)));
      applyPickerOffset(offsetForVal(v), true);
      state = 'snapped';
    }
  });

  magnifier.addEventListener('wheel', e => {
    if (state !== 'snapped' && state !== 'picking') return;
    e.preventDefault();
    applyPickerOffset(offsetForVal(Math.max(MIN_V, Math.min(MAX_V, pickerVal + (e.deltaY > 0 ? 1 : -1)))), true);
  }, { passive: false });

  // ── Screen management ─────────────────────────────────────────
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    const onGame = (id === 'screenGame');
    magnifier.style.display = onGame ? 'block' : 'none';
    submitBtn.style.display  = onGame ? '' : 'none';
    gameActive = onGame;
    if (onGame) {
      updateLensGeometry(); positionMagHome(false);
      bgMusic.play().catch(() => {});
    } else {
      bgMusic.pause(); bgMusic.currentTime = 0;
    }
  }

  function goHome() { showScreen('screenHome'); }

  // ── Game logic ────────────────────────────────────────────────
  let deck = [], idx = 0, correctCount = 0, results = [];

  function startGame() {
    deck = shuffle(ALL_PROBLEMS);
    idx = 0; correctCount = 0;
    results = new Array(deck.length).fill('pending');
    buildPickerItems(); buildProgRow(); loadProblem();
    showScreen('screenGame');
  }

  function buildProgRow() {
    const row = document.getElementById('progRow');
    row.innerHTML = '';
    deck.forEach((_, i) => {
      const d = document.createElement('div');
      d.className = 'prog-dot' + (i === 0 ? ' current' : '');
      d.id = 'dot' + i; row.appendChild(d);
    });
  }

  function updateProgRow() {
    deck.forEach((_, i) => {
      const d = document.getElementById('dot' + i);
      if (!d) return;
      d.className = 'prog-dot '
        + (results[i] === 'correct' ? 'done-ok'
        :  results[i] === 'wrong'   ? 'done-bad'
        :  i === idx                ? 'current' : '');
    });
  }

  function loadProblem() {
    const p = deck[idx];
    document.getElementById('caseLabel').textContent     = 'Case #' + (idx + 1) + ' of ' + deck.length;
    document.getElementById('cardCaseLabel').textContent  = 'Case #' + (idx + 1);
    document.getElementById('vLeft').textContent  = p.left;
    document.getElementById('vRight').textContent = p.right;
    feedbackMsg.innerHTML = '&nbsp;'; feedbackMsg.className = 'feedback-msg';
    dragHint.style.display = '';
    const ans = p.total;
    applyPickerOffset(offsetForVal(Math.max(MIN_V, Math.min(MAX_V, ans <= 10 ? ans + 5 : ans - 5))), false);
    updateProgRow();
    unsnap(false);
  }

  function submitAnswer() {
    if (state !== 'snapped' && state !== 'picking') return;
    const p = deck[idx];
    if (pickerVal === p.total) {
      results[idx] = 'correct'; correctCount++;
      caseCard.classList.remove('flash-bad'); void caseCard.offsetWidth;
      caseCard.classList.add('flash-ok');
      feedbackMsg.textContent = 'GO GO GADGET! 🎉'; feedbackMsg.className = 'feedback-msg ok';
      updateProgRow(); submitBtn.classList.remove('active');
      setTimeout(() => {
        caseCard.classList.remove('flash-ok');
        idx++;
        if (idx >= deck.length) showFinish(); else loadProblem();
      }, 1200);
    } else {
      results[idx] = 'wrong';
      caseCard.classList.remove('flash-ok'); void caseCard.offsetWidth;
      caseCard.classList.add('flash-bad');
      magnifier.classList.remove('shake'); void magnifier.offsetWidth;
      magnifier.classList.add('shake');
      feedbackMsg.textContent = 'Not quite, Inspector! Try again. 🔍';
      feedbackMsg.className = 'feedback-msg bad';
      setTimeout(() => { caseCard.classList.remove('flash-bad'); magnifier.classList.remove('shake'); updateProgRow(); }, 450);
    }
  }

  function showFinish() {
    showScreen('screenFinish');
    const pct = Math.round((correctCount / deck.length) * 100);
    document.getElementById('finishIcon').textContent  = pct === 100 ? '🏆' : pct >= 70 ? '🕵️' : '🔍';
    document.getElementById('finishTitle').textContent = pct === 100 ? 'Case Closed!' : pct >= 70 ? 'Good Work, Detective!' : 'Keep Investigating!';
    document.getElementById('finishScore').textContent =
      correctCount + ' of ' + deck.length + ' solved on the first try.\n'
      + (pct === 100 ? 'Perfect score, Inspector!' : 'Every detective gets better with practice!');
  }
</script>
</body>
