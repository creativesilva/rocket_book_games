<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#120800" />
  <link rel="apple-touch-icon" href="rocket_book_logo.png?v=12" />
  <title>Digit Detective</title>
  <style>
    :root {
      --bg:    #120800;
      --gold:  #f5c518;
      --gold2: #c9a012;
      --text:  #f5ead8;
      --muted: rgba(245,234,216,0.60);
      --ok:    #22c55e;
      --bad:   #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      width: 100%; height: 100dvh; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -webkit-user-select: none; user-select: none;
    }

    /* ── Full-screen background ──────────────────────── */
    #bgLayer {
      position: fixed; inset: 0; z-index: 0;
      background: var(--bg);
    }
    #bgLayer img {
      width: 100%; height: 100%;
      object-fit: cover; object-position: center center;
      opacity: 0.75; display: block;
    }

    /* ── Screens ────────────────────────────────────── */
    .screen {
      display: none; flex-direction: column; align-items: center;
      position: absolute; inset: 0; z-index: 10;
    }
    .screen.active { display: flex; }

    /* ── Back button ────────────────────────────────── */
    .back-btn {
      position: absolute;
      top: max(14px, env(safe-area-inset-top));
      left: 14px;
      background: rgba(245,197,24,0.13);
      border: 1px solid rgba(245,197,24,0.28);
      border-radius: 50px; padding: 7px 14px 7px 10px;
      color: var(--muted); font-size: 14px; font-weight: 700;
      cursor: pointer; font-family: inherit;
      display: flex; align-items: center; gap: 6px; z-index: 20;
    }
    .back-btn:active { background: rgba(245,197,24,0.24); }

    /* ── Mute button ────────────────────────────────── */
    #muteBtn {
      position: absolute;
      top: max(14px, env(safe-area-inset-top));
      right: 14px;
      background: rgba(245,197,24,0.13);
      border: 1px solid rgba(245,197,24,0.28);
      border-radius: 50%; width: 36px; height: 36px;
      font-size: 16px; cursor: pointer; font-family: inherit;
      display: flex; align-items: center; justify-content: center;
      z-index: 20;
    }
    #muteBtn:active { background: rgba(245,197,24,0.24); }

    /* ═══ HOME ═══════════════════════════════════════ */
    #screenHome { justify-content: center; }
    .home-badge {
      width: 140px; height: 140px; border-radius: 30px;
      background: linear-gradient(145deg, #f5c518, #c9a012);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; margin-bottom: 20px; padding: 0;
      box-shadow: 0 8px 32px rgba(0,0,0,0.60);
    }
    .home-badge img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .ari-finish { width: min(200px, 50vw); height: auto; display: block; margin: 0 auto 6px; filter: drop-shadow(0 8px 24px rgba(0,0,0,0.55)); }
    .home-title { font-size: clamp(30px,8vw,40px); font-weight: 900; text-align: center; line-height: 1.1; margin-bottom: 8px; color: var(--gold); text-shadow: 0 2px 12px rgba(0,0,0,0.70); }
    .home-sub   { font-size: 15px; color: var(--muted); font-weight: 600; text-align: center; margin-bottom: 44px; line-height: 1.45; max-width: 270px; text-shadow: 0 1px 6px rgba(0,0,0,0.80); }
    .start-btn  {
      background: linear-gradient(135deg, #f5c518, #c9a012);
      color: #160c04; border: none; border-radius: 18px;
      padding: 18px 46px; font-size: 19px; font-weight: 900;
      font-family: inherit; cursor: pointer;
      box-shadow: 0 6px 24px rgba(0,0,0,0.50);
    }
    .start-btn:active { transform: scale(0.96); }

    /* ═══ GAME SCREEN ════════════════════════════════ */
    #screenGame {
      justify-content: flex-start; align-items: center;
      padding-top:   max(calc(env(safe-area-inset-top) + 54px), 68px);
      padding-left:  max(20px, env(safe-area-inset-left));
      padding-right: max(20px, env(safe-area-inset-right));
      padding-bottom: max(calc(env(safe-area-inset-bottom) + 90px), 100px);
      gap: 8px;
    }

    .prog-row { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; }
    .prog-dot { width: 9px; height: 9px; border-radius: 50%; background: rgba(245,197,24,0.20); transition: background 0.2s; }
    .prog-dot.done-ok  { background: var(--ok); }
    .prog-dot.done-bad { background: rgba(239,68,68,0.60); }
    .prog-dot.current  { background: var(--gold); }

    .case-label { font-size: 11px; font-weight: 800; letter-spacing: 0.12em; color: var(--gold); text-transform: uppercase; opacity: 0.9; text-shadow: 0 1px 6px rgba(0,0,0,0.80); }

    /* ── Case file card ─────────────────────────────── */
    .case-card {
      width: 100%; max-width: 300px;
      background: transparent;
      border: none;
      border-radius: 20px; padding: 22px 18px 18px;
      transition: filter 0.25s;
      flex-shrink: 0;
    }
    .case-card.glow-snap {
      filter: drop-shadow(0 0 14px rgba(245,197,24,0.55));
    }
    .card-case-label {
      font-size: 10px; font-weight: 900; letter-spacing: 0.14em;
      color: var(--gold); text-transform: uppercase;
      text-align: center; margin-bottom: 12px; opacity: 0.9;
      text-shadow: 0 1px 6px rgba(0,0,0,0.80);
    }

    /* ── Vertical equation ──────────────────────────── */
    .v-eq { display: flex; flex-direction: column; align-items: center; gap: 0; width: 100%; }
    .v-row { display: flex; align-items: center; width: min(190px, 94%); min-height: clamp(66px, 15vw, 84px); }
    .v-op  { font-size: clamp(26px, 7vw, 38px); font-weight: 500; color: rgba(245,234,216,0.72); width: 38px; text-align: center; flex-shrink: 0; }
    .v-num { font-size: clamp(52px, 13vw, 70px); font-weight: 900; color: #f5ead8; flex: 1; text-align: center; line-height: 1; text-shadow: 0 2px 10px rgba(0,0,0,0.90); }
    .v-line { width: min(190px, 94%); height: 3px; background: rgba(245,234,216,0.45); border-radius: 2px; margin: 3px 0 1px; }

    /* Sum row */
    #rowSum { min-height: clamp(66px, 15vw, 84px); }
    #vSum { position: relative; display: flex; align-items: center; justify-content: center; }

    #fpImg {
      position: absolute; left: 50%; transform: translateX(-50%);
      height: 0.82em; width: auto;
      object-fit: contain;
    }
    #blankVal {
      opacity: 0; transition: opacity 0.28s;
      position: relative; z-index: 1; line-height: 1;
    }
    #blankVal.show { opacity: 1; }

    /* Hints */
    .drag-hint {
      font-size: 14px; color: rgba(245,197,24,0.90); font-weight: 700;
      letter-spacing: 0.04em; text-align: center;
      animation: hintFade 2s ease-in-out infinite;
      min-height: 20px; text-shadow: 0 1px 6px rgba(0,0,0,0.80);
    }
    @keyframes hintFade { 0%,100%{opacity:0.9;} 50%{opacity:0.22;} }

    .feedback-msg {
      font-size: 16px; font-weight: 800; text-align: center;
      min-height: 24px; letter-spacing: 0.02em;
      text-shadow: 0 1px 6px rgba(0,0,0,0.70);
    }
    .feedback-msg.ok  { color: var(--ok); }
    .feedback-msg.bad { color: var(--bad); }

    @keyframes flashOk  { 0%,100%{filter:none;} 50%{filter:drop-shadow(0 0 24px rgba(34,197,94,0.90));} }
    @keyframes flashBad { 0%,100%{filter:none;} 30%,70%{filter:drop-shadow(0 0 24px rgba(239,68,68,0.90));} }
    .case-card.flash-ok  { animation: flashOk  0.45s ease; }
    .case-card.flash-bad { animation: flashBad 0.40s ease; }

    /* Submit */
    #submitBtn {
      position: fixed;
      left: 50%; transform: translateX(-50%);
      bottom: max(calc(env(safe-area-inset-bottom) + 14px), 20px);
      background: linear-gradient(135deg, #f5c518, #c9a012);
      color: #160c04; border: none; border-radius: 16px;
      padding: 17px 36px; font-size: 17px; font-weight: 900;
      font-family: inherit; cursor: pointer; white-space: nowrap;
      box-shadow: 0 4px 20px rgba(0,0,0,0.55);
      opacity: 0.28; pointer-events: none;
      transition: opacity 0.22s; z-index: 250;
    }
    #submitBtn.active { opacity: 1; pointer-events: auto; }
    #submitBtn.active:active { transform: translateX(-50%) scale(0.97); }

    /* ═══ MAGNIFIER ══════════════════════════════════ */
    /* Just the gold-ring PNG — lens is transparent air, no overlay */
    #magnifier {
      position: fixed;
      /* Size to frame a single 2-digit number — snug around the answer */
      width: min(129px, 33vw);
      z-index: 200;
      touch-action: none;
      cursor: grab;
      overflow: visible; /* rotated handle extends beyond box */
    }
    #magnifier.dragging { cursor: grabbing; }

    #magImg {
      width: 100%; display: block;
      pointer-events: none;
      filter: drop-shadow(0 8px 22px rgba(0,0,0,0.80));
    }

    @keyframes magShake {
      0%,100%{transform:translateX(0);}
      20%{transform:translateX(-9px);}
      40%{transform:translateX(9px);}
      60%{transform:translateX(-5px);}
      80%{transform:translateX(5px);}
    }
    #magnifier.shake { animation: magShake 0.38s ease; }

    /* ═══ FINISH ═════════════════════════════════════ */
    #screenFinish {
      justify-content: flex-start;
      overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: max(calc(env(safe-area-inset-top) + 54px), 60px) max(16px, env(safe-area-inset-right)) max(calc(env(safe-area-inset-bottom) + 20px), 30px) max(16px, env(safe-area-inset-left));
      gap: 6px;
    }
    .finish-title { font-size: 28px; font-weight: 900; color: var(--gold); text-align: center; margin-bottom: 4px; text-shadow: 0 2px 12px rgba(0,0,0,0.70); }
    .case-report {
      width: 100%; max-width: 300px;
      background: rgba(18, 10, 2, 0.82);
      border: 1px dashed rgba(245, 197, 24, 0.38);
      border-radius: 12px;
      padding: 14px 16px;
      margin: 4px auto 14px;
      text-align: left;
    }
    .case-report-hdr {
      font-size: 10px; font-weight: 900; letter-spacing: 0.18em;
      color: var(--gold); text-transform: uppercase; text-align: center;
      padding-bottom: 8px; margin-bottom: 8px;
      border-bottom: 1px solid rgba(245, 197, 24, 0.25);
      opacity: 0.9;
    }
    .report-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 5px 0; font-size: 13px;
      border-bottom: 1px solid rgba(245, 234, 216, 0.07);
    }
    .report-row:last-child { border-bottom: none; }
    .report-eq  { color: var(--text); font-weight: 700; letter-spacing: 0.03em; }
    .report-ok  { color: #4ade80; font-weight: 700; font-size: 12px; }
    .report-ok2 { color: #fbbf24; font-weight: 700; font-size: 12px; }
    .replay-btn {
      background: linear-gradient(135deg, #f5c518, #c9a012);
      color: #160c04; border: none; border-radius: 16px;
      padding: 15px 40px; font-size: 17px; font-weight: 900;
      font-family: inherit; cursor: pointer; flex-shrink: 0;
      box-shadow: 0 4px 18px rgba(0,0,0,0.50);
    }
    .replay-btn:active { transform: scale(0.97); }

    /* ═══ LANDSCAPE ══════════════════════════════════ */
    @media (orientation: landscape) {
      #screenGame {
        padding-top:    max(calc(env(safe-area-inset-top) + 8px), 14px);
        padding-bottom: max(calc(env(safe-area-inset-bottom) + 68px), 76px);
        gap: 4px;
      }
      .case-card { padding: 8px 14px 8px; max-width: 340px; }
      .card-case-label { margin-bottom: 6px; }
      .v-row, #rowSum { min-height: clamp(46px, 10vh, 60px); width: min(155px, 94%); }
      .v-num  { font-size: clamp(36px, 8.5vh, 50px); }
      .v-op   { font-size: clamp(20px, 5vh, 28px); width: 30px; }
      .v-line { width: min(155px, 94%); margin: 2px 0 1px; }
      #submitBtn { padding: 12px 28px; bottom: max(calc(env(safe-area-inset-bottom) + 6px), 10px); }
    }
  </style>
</head>
<body>

<audio id="bgMusic" src="Digit_Detective_Beat.mp3" loop preload="auto"></audio>

<div id="bgLayer">
  <img src="Digit_Detective_Background_v2.png" alt="">
</div>

<!-- HOME -->
<div class="screen active" id="screenHome">
  <div class="home-badge"><img src="Ari_Detective.png" alt="Ari Detective"></div>
  <div class="home-title">Digit Detective</div>
  <div class="home-sub">Drag the magnifying glass up to the mystery number to crack the case!</div>
  <button class="start-btn" onclick="startGame()" type="button">Open Case File</button>
</div>

<!-- GAME -->
<div class="screen" id="screenGame">
  <button class="back-btn" onclick="goHome()" type="button">
    <svg width="8" height="14" viewBox="0 0 8 14" fill="none"><path d="M7 1L1 7L7 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Home
  </button>
  <button id="muteBtn" onclick="toggleMute()" type="button" title="Toggle music">🔊</button>

  <div class="prog-row" id="progRow"></div>
  <div class="case-label" id="caseLabel">Case #1 of 10</div>

  <div class="case-card" id="caseCard">
    <div class="card-case-label" id="cardCaseLabel">Case #1</div>
    <div class="v-eq">
      <div class="v-row">
        <div class="v-op"></div>
        <div class="v-num" id="vLeft">—</div>
      </div>
      <div class="v-row">
        <div class="v-op">+</div>
        <div class="v-num" id="vRight">—</div>
      </div>
      <div class="v-line"></div>
      <div class="v-row" id="rowSum">
        <div class="v-op"></div>
        <div class="v-num" id="vSum">
          <img src="Finger_Print.png" id="fpImg" alt="?">
          <span id="blankVal"></span>
        </div>
      </div>
    </div>
  </div>

  <div class="drag-hint" id="dragHint">drag 🔍 up to the mystery number</div>
  <div class="feedback-msg" id="feedbackMsg">&nbsp;</div>
</div>

<!-- FINISH -->
<div class="screen" id="screenFinish">
  <button class="back-btn" onclick="goHome()" type="button">
    <svg width="8" height="14" viewBox="0 0 8 14" fill="none"><path d="M7 1L1 7L7 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Home
  </button>
  <img src="Ari_Detective.png" alt="" class="ari-finish">
  <div class="finish-title" id="finishTitle">Case Closed!</div>
  <div id="caseReport" class="case-report"></div>
  <button class="replay-btn" onclick="startGame()" type="button">New Case File</button>
</div>

<button id="submitBtn" style="display:none" onclick="submitAnswer()" type="button">
  🔍 Solve Case!
</button>

<!-- MAGNIFIER: just the PNG, no lens overlay -->
<div id="magnifier" style="display:none">
  <img id="magImg" src="Magnifying_Glass_v2.png" alt="" />
</div>

<script>
  try { screen.orientation.lock('portrait').catch(()=>{}); } catch(e) {}

  // ── Background music ──────────────────────────────────────────
  const bgMusic = document.getElementById('bgMusic');
  bgMusic.volume = 0.9;
  let muted = false;
  function toggleMute() {
    muted = !muted;
    bgMusic.muted = muted;
    document.getElementById('muteBtn').textContent = muted ? '🔇' : '🔊';
  }

  // ── Correct-answer chime (same Web Audio pattern as Fast & Fluent) ──
  const CHIME_SRC = 'chime.m4a';
  let _wac = null, _chimeBuf = null;
  function _initWac() {
    if (_wac) return;
    try { _wac = new (window.AudioContext || window.webkitAudioContext)(); _wac.resume().catch(() => {}); } catch(e) {}
  }
  async function _loadChime() {
    if (_chimeBuf || !_wac) return;
    try {
      const raw = await (await fetch(CHIME_SRC)).arrayBuffer();
      _chimeBuf = await _wac.decodeAudioData(raw);
    } catch(e) {}
  }
  const _chimeFb = Array.from({ length: 4 }, () => { const a = new Audio(CHIME_SRC); a.load(); return a; });
  let _chimeFbIdx = 0;
  function playChime() {
    if (_wac && _chimeBuf) {
      const src = _wac.createBufferSource();
      src.buffer = _chimeBuf; src.connect(_wac.destination); src.start(0);
    } else {
      const a = _chimeFb[_chimeFbIdx++ % _chimeFb.length];
      a.currentTime = 0; a.play().catch(() => {});
    }
  }
  document.addEventListener('pointerdown', () => { _initWac(); _loadChime(); }, { once: true });

  // ── Mechanical tick (Web Audio — no file, synthesised) ────────
  function playTick() {
    if (!_wac) return;
    const sr = _wac.sampleRate;
    const buf = _wac.createBuffer(1, Math.floor(sr * 0.022), sr);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) {
      const t = i / data.length;
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 2.5) * 0.28;
    }
    const src = _wac.createBufferSource();
    const flt = _wac.createBiquadFilter();
    flt.type = 'bandpass'; flt.frequency.value = 1100; flt.Q.value = 2;
    src.buffer = buf; src.connect(flt); flt.connect(_wac.destination);
    src.start();
  }

  // ── Problems ──────────────────────────────────────────────────
  const ALL_PROBLEMS = [
    { total:11, left:5,  right:6  },
    { total:12, left:3,  right:9  },
    { total:12, left:7,  right:5  },
    { total:14, left:5,  right:9  },
    { total:14, left:8,  right:6  },
    { total:15, left:5,  right:10 },
    { total:16, left:7,  right:9  },
    { total:17, left:8,  right:9  },
    { total:18, left:8,  right:10 },
    { total:18, left:9,  right:9  },
  ];
  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }

  // ── DOM refs ──────────────────────────────────────────────────
  const magnifier  = document.getElementById('magnifier');
  const magImg     = document.getElementById('magImg');
  const caseCard   = document.getElementById('caseCard');
  const dragHint   = document.getElementById('dragHint');
  const feedbackMsg= document.getElementById('feedbackMsg');
  const submitBtn  = document.getElementById('submitBtn');
  const fpImg      = document.getElementById('fpImg');
  const blankVal   = document.getElementById('blankVal');
  const vSum       = document.getElementById('vSum');

  // ── Magnifier geometry ────────────────────────────────────────
  // Always fresh — no cached values so resize never leaves stale geometry.
  // Lens is at (50%, 33.5%) of the PNG; image is rotate(-45deg) CCW.
  function getLensGeom() {
    const w = magnifier.offsetWidth;
    const h = magImg.offsetHeight;
    if (!w || !h) return { ox: 44, oy: 57 };
    // v2 PNG: handle already at lower-right, no rotation needed.
    // Lens ring center at ~39% x, 44% y of the image.
    return { ox: w * 0.39, oy: h * 0.44 };
  }

  magImg.addEventListener('load', () => { if (gameActive) positionMagHome(false); });
  window.addEventListener('resize', () => { if (gameActive) positionMagHome(false); });

  // ── Magnifier position ────────────────────────────────────────
  let magCX = 0, magCY = 0, gameActive = false;

  function setMagPos(lx, ly, animate) {
    const g = getLensGeom();
    magCX = lx; magCY = ly;
    magnifier.style.transition = animate
      ? 'left 0.38s cubic-bezier(0.34,1.56,0.64,1), top 0.38s cubic-bezier(0.34,1.56,0.64,1)'
      : 'none';
    magnifier.style.left = (lx - g.ox) + 'px';
    magnifier.style.top  = (ly - g.oy) + 'px';
  }

  function positionMagHome(animate) {
    // Double rAF: ensures browser has reflowed before measuring positions
    requestAnimationFrame(() => requestAnimationFrame(() => {
      const fp = getBlankCenter();
      const gap = window.innerHeight < 520 ? 90 : 150;
      const lx = fp ? fp.x : window.innerWidth / 2;
      const ly = fp && fp.y > 80 ? fp.y + gap : window.innerHeight * 0.80;
      setMagPos(lx, ly, animate);
    }));
  }

  // ── State machine ─────────────────────────────────────────────
  let state = 'idle', dragOffX = 0, dragOffY = 0, pickerReady = false;

  // ── Silent picker ─────────────────────────────────────────────
  // No visual — just tracks a value and writes to #blankVal on the card
  // ITEM_H = 80: requires 80px of drag per number step (less sensitive)
  const ITEM_H = 80, MIN_V = 0, MAX_V = 20, CENTER_OFF = 53;
  let pickerVal = 5, pickerOff = 0;
  let pickStartY = 0, pickStartOff = 0, pickVel = 0, pickLastY = 0, pickLastT = 0;

  function offsetForVal(v) { return CENTER_OFF - v * ITEM_H; }
  function valForOffset(o) { return Math.round((CENTER_OFF - o) / ITEM_H); }
  function clampOff(o)     { return Math.max(offsetForVal(MAX_V), Math.min(offsetForVal(MIN_V), o)); }

  function applyPickerOffset(o) {
    o = clampOff(o);
    pickerOff = o;
    const v = Math.max(MIN_V, Math.min(MAX_V, valForOffset(o)));
    if (v !== pickerVal) { playTick(); }
    pickerVal = v;
    blankVal.textContent = v;
    if (!pickerReady) { pickerReady = true; submitBtn.classList.add('active'); }
  }

  // ── Fingerprint proximity fade ────────────────────────────────
  const FP_FADE_START = 200, FP_FADE_END = 50;
  function setFpOpacity(dist, withTransition) {
    const op = dist >= FP_FADE_START ? 1
      : dist <= FP_FADE_END ? 0
      : (dist - FP_FADE_END) / (FP_FADE_START - FP_FADE_END);
    fpImg.style.transition = withTransition ? 'opacity 0.30s' : 'none';
    fpImg.style.opacity = op.toFixed(3);
  }

  // ── Blank center ──────────────────────────────────────────────
  function getBlankCenter() {
    const r = fpImg.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }

  // ── Snap / unsnap ─────────────────────────────────────────────
  const SNAP_DIST = 130;

  function snapMagnifier(bc) {
    setMagPos(bc.x, bc.y, true);
    state = 'snapped';
    pickerReady = false;
    blankVal.textContent = '?';
    setTimeout(() => {
      setFpOpacity(0, true);
      blankVal.classList.add('show');
      dragHint.style.display = 'none';
      // submitBtn activates only after user selects a value
    }, 240);
  }

  function unsnap(animate) {
    state = 'idle';
    pickerReady = false;
    blankVal.textContent = '?';
    setFpOpacity(9999, true);
    blankVal.classList.remove('show');
    dragHint.style.display = '';
    submitBtn.classList.remove('active');
    positionMagHome(animate);
  }

  // ── Pointer events ────────────────────────────────────────────
  magnifier.addEventListener('pointerdown', e => {
    e.preventDefault();
    _initWac();
    if (_wac && _wac.state === 'suspended') _wac.resume().catch(() => {});
    magnifier.setPointerCapture(e.pointerId);
    if (state === 'snapped' || state === 'picking') {
      state = 'picking';
      pickStartY = e.clientY; pickStartOff = pickerOff;
      pickVel = 0; pickLastY = e.clientY; pickLastT = Date.now();
    } else if (state === 'idle') {
      // Read the actual rendered position to handle mid-animation grabs
      const g = getLensGeom();
      const rect = magnifier.getBoundingClientRect();
      const lx = rect.left + g.ox;
      const ly = rect.top  + g.oy;
      magCX = lx; magCY = ly;
      magnifier.style.transition = 'none';
      state = 'dragging';
      magnifier.classList.add('dragging');
      dragOffX = e.clientX - lx;
      dragOffY = e.clientY - ly;
    }
  });

  magnifier.addEventListener('pointermove', e => {
    if (state === 'dragging') {
      const cx = e.clientX - dragOffX, cy = e.clientY - dragOffY;
      setMagPos(cx, cy, false);
      const bc = getBlankCenter();
      if (bc) {
        const dist = Math.hypot(cx - bc.x, cy - bc.y);
        caseCard.classList.toggle('glow-snap', dist < SNAP_DIST + 50);
        setFpOpacity(dist, false);
      }
    } else if (state === 'picking') {
      const dy = e.clientY - pickStartY;
      applyPickerOffset(pickStartOff + dy);
      const now = Date.now(), dt = now - pickLastT;
      if (dt > 0) pickVel = (e.clientY - pickLastY) / dt;
      pickLastY = e.clientY; pickLastT = now;
    }
  });

  magnifier.addEventListener('pointerup', e => {
    if (state === 'dragging') {
      magnifier.classList.remove('dragging');
      caseCard.classList.remove('glow-snap');
      const bc = getBlankCenter();
      if (bc && Math.hypot(magCX - bc.x, magCY - bc.y) < SNAP_DIST) { snapMagnifier(bc); return; }
      state = 'idle';
      setFpOpacity(9999, true);
      positionMagHome(true);
    } else if (state === 'picking') {
      const projected = pickerOff + pickVel * 140;
      const v = Math.max(MIN_V, Math.min(MAX_V, Math.round((CENTER_OFF - projected) / ITEM_H)));
      applyPickerOffset(offsetForVal(v));
      state = 'snapped';
    }
  });

  magnifier.addEventListener('wheel', e => {
    if (state !== 'snapped' && state !== 'picking') return;
    e.preventDefault();
    applyPickerOffset(offsetForVal(Math.max(MIN_V, Math.min(MAX_V, pickerVal + (e.deltaY > 0 ? 1 : -1)))));
  }, { passive: false });

  document.addEventListener('keydown', e => {
    if (state !== 'snapped' && state !== 'picking') return;
    if (e.key === 'ArrowUp') {
      e.preventDefault();
      applyPickerOffset(offsetForVal(Math.min(MAX_V, pickerVal + 1)));
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      applyPickerOffset(offsetForVal(Math.max(MIN_V, pickerVal - 1)));
    } else if ((e.key === 'Enter' || e.key === ' ') && pickerReady) {
      e.preventDefault();
      submitAnswer();
    }
  });

  // ── Screen management ─────────────────────────────────────────
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    const onGame = (id === 'screenGame');
    magnifier.style.display = onGame ? 'block' : 'none';
    submitBtn.style.display  = onGame ? '' : 'none';
    gameActive = onGame;
    if (onGame) {
      positionMagHome(false);
      bgMusic.play().catch(() => {});
    } else {
      bgMusic.pause(); bgMusic.currentTime = 0;
    }
  }

  function goHome() { showScreen('screenHome'); }

  // ── Game logic ────────────────────────────────────────────────
  let liveQueue = [], TOTAL_UNIQUE = 0;
  let solved = new Set(), probStats = {};

  function startGame() {
    const shuffled = shuffle(ALL_PROBLEMS);
    liveQueue = shuffled.map((p, i) => ({ ...p, pid: i, attempts: 0 }));
    TOTAL_UNIQUE = liveQueue.length;
    solved = new Set(); probStats = {};
    for (let i = 0; i < TOTAL_UNIQUE; i++) {
      probStats[i] = { firstTryCorrect: null, attempts: 0, problem: liveQueue[i] };
    }
    buildProgRow(); loadProblem();
    showScreen('screenGame');
  }

  function buildProgRow() {
    const row = document.getElementById('progRow');
    row.innerHTML = '';
    for (let i = 0; i < TOTAL_UNIQUE; i++) {
      const d = document.createElement('div');
      d.className = 'prog-dot'; d.id = 'pdot' + i;
      row.appendChild(d);
    }
    updateProgRow();
  }

  function updateProgRow() {
    const currentPid = liveQueue.length > 0 ? liveQueue[0].pid : -1;
    for (let i = 0; i < TOTAL_UNIQUE; i++) {
      const d = document.getElementById('pdot' + i); if (!d) continue;
      d.className = 'prog-dot'
        + (solved.has(i) ? ' done-ok' : i === currentPid ? ' current' : '');
    }
  }

  function loadProblem() {
    const p = liveQueue[0];
    const caseNum = solved.size + 1;
    document.getElementById('caseLabel').textContent    = 'Case #' + caseNum + ' of ' + TOTAL_UNIQUE;
    document.getElementById('cardCaseLabel').textContent = 'Case #' + caseNum;
    document.getElementById('vLeft').textContent  = p.left;
    document.getElementById('vRight').textContent = p.right;
    feedbackMsg.innerHTML = '&nbsp;'; feedbackMsg.className = 'feedback-msg';
    dragHint.style.display = '';
    pickerOff = offsetForVal(10); pickerVal = 10; blankVal.textContent = '?';
    updateProgRow();
    unsnap(false);
  }

  function submitAnswer() {
    if (state !== 'snapped' && state !== 'picking') return;
    const slot = liveQueue[0];
    slot.attempts++;
    if (pickerVal === slot.total) {
      playChime();
      if (probStats[slot.pid].firstTryCorrect === null) {
        probStats[slot.pid].firstTryCorrect = slot.attempts === 1;
      }
      probStats[slot.pid].attempts = slot.attempts;
      solved.add(slot.pid);
      liveQueue.shift();
      caseCard.classList.remove('flash-bad'); void caseCard.offsetWidth;
      caseCard.classList.add('flash-ok');
      feedbackMsg.textContent = 'GO GO GADGET! 🎉'; feedbackMsg.className = 'feedback-msg ok';
      updateProgRow();
      submitBtn.classList.remove('active');
      state = 'idle'; pickerReady = false;
      positionMagHome(true);
      setTimeout(() => {
        caseCard.classList.remove('flash-ok');
        if (solved.size >= TOTAL_UNIQUE) showFinish(); else loadProblem();
      }, 1500);
    } else {
      if (probStats[slot.pid].firstTryCorrect === null) {
        probStats[slot.pid].firstTryCorrect = false;
      }
      caseCard.classList.remove('flash-ok'); void caseCard.offsetWidth;
      caseCard.classList.add('flash-bad');
      magnifier.classList.remove('shake'); void magnifier.offsetWidth;
      magnifier.classList.add('shake');
      feedbackMsg.textContent = 'Not quite, Detective! Back to the case files... 🔍';
      feedbackMsg.className = 'feedback-msg bad';
      submitBtn.classList.remove('active');
      state = 'idle'; pickerReady = false;
      positionMagHome(true);
      liveQueue.shift();
      const insertPos = Math.min(Math.floor(Math.random() * 3) + 2, liveQueue.length);
      liveQueue.splice(insertPos, 0, slot);
      setTimeout(() => {
        caseCard.classList.remove('flash-bad');
        magnifier.classList.remove('shake');
        loadProblem();
      }, 1300);
    }
  }

  function showFinish() {
    const firstTryCount = Object.values(probStats).filter(s => s.firstTryCorrect === true).length;
    const pct = Math.round((firstTryCount / TOTAL_UNIQUE) * 100);
    document.getElementById('finishTitle').textContent =
      pct === 100 ? 'Case Closed! 🕵️' : pct >= 70 ? 'Good Work, Detective!' : 'Keep Investigating!';

    let html = '<div class="case-report-hdr">📁 Case File Report</div>';
    html += '<div style="color:var(--muted);font-size:12px;font-weight:600;text-align:center;margin-bottom:10px">'
          + firstTryCount + ' / ' + TOTAL_UNIQUE + ' cracked on first try</div>';
    for (let i = 0; i < TOTAL_UNIQUE; i++) {
      const s = probStats[i];
      const p = s.problem;
      const eq = p.left + ' + ' + p.right + ' = ' + p.total;
      if (s.firstTryCorrect === true) {
        html += '<div class="report-row"><span class="report-eq">' + eq + '</span>'
              + '<span class="report-ok">✓ First try</span></div>';
      } else {
        html += '<div class="report-row"><span class="report-eq">' + eq + '</span>'
              + '<span class="report-ok2">✓ ' + s.attempts + ' attempt' + (s.attempts !== 1 ? 's' : '') + '</span></div>';
      }
    }
    document.getElementById('caseReport').innerHTML = html;

    try {
      const rep = JSON.parse(localStorage.getItem('rocketBookReports') || '[]');
      rep.push({ game: 'Digit Detective', correct: firstTryCount, total: TOTAL_UNIQUE, date: new Date().toISOString() });
      localStorage.setItem('rocketBookReports', JSON.stringify(rep.slice(-50)));
    } catch(e) {}

    showScreen('screenFinish');
  }
</script>
