<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Brain Break" />
  <meta name="theme-color" content="#0d0d20" />
  <link rel="apple-touch-icon" href="rocket_book_logo.png?v=12" />
  <title>Brain Break</title>
  <style>
    :root {
      --safe-top:    max(14px, env(safe-area-inset-top));
      --safe-bottom: max(14px, env(safe-area-inset-bottom));
      --safe-left:   max(20px, env(safe-area-inset-left));
      --safe-right:  max(20px, env(safe-area-inset-right));
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      width: 100%; height: 100%;
      background: #0d0d20;
      overflow: hidden;
      touch-action: manipulation;
      -webkit-user-select: none; user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Screen system ─────────────────────────────────────────────────── */
    .screen {
      position: fixed; inset: 0;
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
    }
    .screen.active { display: flex; }

    /* ═══════════════════════════════════════════════════════════════════
       MENU SCREEN — works in portrait and landscape
    ═══════════════════════════════════════════════════════════════════ */
    #menuScreen {
      background:
        radial-gradient(ellipse at 20% 10%,  rgba(139,92,246,0.38), transparent 55%),
        radial-gradient(ellipse at 80% 15%,  rgba(59,130,246,0.28), transparent 50%),
        radial-gradient(ellipse at 10% 90%,  rgba(236,72,153,0.22), transparent 45%),
        radial-gradient(ellipse at 85% 80%,  rgba(6,182,212,0.22),  transparent 40%),
        #0d0d20;
      padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
      gap: 0;
    }

    .menu-back-btn {
      position: absolute;
      top: var(--safe-top); left: var(--safe-left);
      width: 36px; height: 36px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.20);
      border-radius: 50%; color: #fff;
      font-size: 18px; display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    }
    .menu-back-btn:active { background: rgba(255,255,255,0.24); transform: scale(0.92); }

    .menu-heading {
      text-align: center;
      margin-bottom: clamp(14px, 3vh, 28px);
    }
    .menu-title {
      font-size: clamp(24px, 5vw, 34px);
      font-weight: 900; color: #fff;
      letter-spacing: -0.5px; line-height: 1.1;
    }
    .menu-sub {
      font-size: 13px; font-weight: 600;
      color: rgba(255,255,255,0.42);
      text-transform: uppercase; letter-spacing: 0.06em;
      margin-top: 5px;
    }

    /* Vertical card stack, centered */
    .card-stack {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: clamp(8px, 1.6vh, 14px);
      width: 100%; max-width: 440px;
    }

    .vid-card {
      width: 100%;
      border-radius: 18px;
      padding: 14px 18px;
      display: flex; flex-direction: row;
      align-items: center; gap: 16px;
      cursor: pointer;
      position: relative; overflow: hidden;
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: 0 6px 22px rgba(0,0,0,0.32), inset 0 1px 0 rgba(255,255,255,0.22);
      transition: transform 0.13s ease, box-shadow 0.13s ease;
    }
    .vid-card:active { transform: scale(0.96); box-shadow: 0 3px 10px rgba(0,0,0,0.28); }
    .vid-card::before {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.16) 0%, transparent 55%);
    }

    .card-icon {
      font-size: clamp(30px, 5vw, 40px);
      line-height: 1; flex-shrink: 0;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.22));
      position: relative; z-index: 1;
    }
    .card-text {
      flex: 1; min-width: 0;
      position: relative; z-index: 1;
    }
    .card-name {
      font-size: clamp(14px, 2.5vw, 17px);
      font-weight: 800; color: #fff;
      line-height: 1.2;
    }
    .card-hint {
      font-size: 12px; font-weight: 600;
      color: rgba(255,255,255,0.55);
      margin-top: 2px;
    }
    .card-arrow {
      font-size: 20px; color: rgba(255,255,255,0.55);
      flex-shrink: 0; position: relative; z-index: 1;
    }

    /* Card colors */
    .card-0 { background: linear-gradient(145deg, #f59e0b, #b45309); }
    .card-1 { background: linear-gradient(145deg, #60a5fa, #1d4ed8); }
    .card-2 { background: linear-gradient(145deg, #f472b6, #be185d); }
    .card-3 { background: linear-gradient(145deg, #34d399, #047857); }
    .card-4 { background: linear-gradient(145deg, #67e8f9, #0e7490); }

    /* ═══════════════════════════════════════════════════════════════════
       ROTATE PROMPT SCREEN
    ═══════════════════════════════════════════════════════════════════ */
    #rotateScreen {
      background: #0d0d20;
      gap: 0;
    }

    .rotate-icon {
      font-size: 64px;
      animation: tilt 2s ease-in-out infinite;
      margin-bottom: 20px;
    }
    @keyframes tilt {
      0%,100% { transform: rotate(0deg); }
      35%,65%  { transform: rotate(90deg); }
    }
    .rotate-title {
      font-size: 26px; font-weight: 900;
      color: #fff; margin-bottom: 8px; text-align: center;
    }
    .rotate-sub {
      font-size: 15px; color: rgba(255,255,255,0.48);
      text-align: center; margin-bottom: 32px;
    }
    .rotate-play-btn {
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.24);
      border-radius: 50px;
      padding: 12px 28px;
      color: rgba(255,255,255,0.60);
      font-family: inherit; font-size: 15px; font-weight: 700;
      cursor: pointer;
    }
    .rotate-play-btn:active { background: rgba(255,255,255,0.20); }

    /* ═══════════════════════════════════════════════════════════════════
       PLAYER SCREEN
    ═══════════════════════════════════════════════════════════════════ */
    #playerScreen {
      background: #000;
      justify-content: flex-start;
    }

    #playerVideo {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: contain;
      background: #000;
    }

    .player-top {
      position: absolute; top: 0; left: 0; right: 0; z-index: 10;
      padding: var(--safe-top) var(--safe-right) 14px var(--safe-left);
      display: flex; align-items: flex-end; justify-content: space-between;
      background: linear-gradient(180deg, rgba(0,0,0,0.68) 0%, transparent 100%);
      pointer-events: none;
    }
    .player-top > * { pointer-events: auto; }

    .player-back-btn {
      display: flex; align-items: center; gap: 7px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 50px; padding: 7px 16px 7px 11px;
      color: #fff; font-size: 14px; font-weight: 700;
      cursor: pointer; font-family: inherit;
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    }
    .player-back-btn:active { background: rgba(255,255,255,0.26); transform: scale(0.95); }

    .player-vid-title {
      font-size: 13px; font-weight: 700;
      color: rgba(255,255,255,0.78);
      background: rgba(0,0,0,0.32);
      border-radius: 20px; padding: 6px 14px;
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      max-width: 210px; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }

    /* Tap zone */
    .tap-zone {
      position: absolute; inset: 0; z-index: 5;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .play-btn-wrap {
      width: 80px; height: 80px;
      background: rgba(255,255,255,0.14);
      border: 2px solid rgba(255,255,255,0.44);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      transition: opacity 0.22s;
    }
    .play-triangle {
      width: 0; height: 0;
      border-top: 16px solid transparent;
      border-bottom: 16px solid transparent;
      border-left: 27px solid rgba(255,255,255,0.95);
      margin-left: 5px;
    }
    .pause-bars { display: flex; gap: 6px; align-items: center; }
    .pause-bar  { width: 6px; height: 26px; background: rgba(255,255,255,0.95); border-radius: 3px; }

    .tap-zone.playing .play-btn-wrap          { opacity: 0; }
    .tap-zone.playing:hover  .play-btn-wrap   { opacity: 1; }
    .tap-zone.playing:active .play-btn-wrap   { opacity: 1; }
    .tap-zone.paused .play-btn-wrap           { opacity: 1; }

    /* Spinner */
    .loading-ring {
      position: absolute; inset: 0; z-index: 4;
      display: none; align-items: center; justify-content: center;
      pointer-events: none;
    }
    .loading-ring.visible { display: flex; }
    .ring {
      width: 48px; height: 48px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: rgba(255,255,255,0.80);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- ── MENU SCREEN ─────────────────────────────────────────────────── -->
  <div class="screen active" id="menuScreen">
    <button class="menu-back-btn" id="menuHomeBtn" type="button" aria-label="Home">&#8592;</button>

    <div class="menu-heading">
      <div class="menu-title">&#x1F3AC; Brain Break</div>
      <div class="menu-sub">Pick a video and dance!</div>
    </div>

    <div class="card-stack" id="cardStack"></div>
  </div>

  <!-- ── ROTATE PROMPT SCREEN ────────────────────────────────────────── -->
  <div class="screen" id="rotateScreen">
    <button class="menu-back-btn" id="rotateBackBtn" type="button" aria-label="Back to menu">&#8592;</button>
    <div class="rotate-icon">&#x1F4F1;</div>
    <div class="rotate-title">Turn it sideways!</div>
    <div class="rotate-sub">Rotate your device to landscape<br>for the best view.</div>
    <button class="rotate-play-btn" id="rotateCancelBtn" type="button">Play anyway</button>
  </div>

  <!-- ── PLAYER SCREEN ───────────────────────────────────────────────── -->
  <div class="screen" id="playerScreen">
    <video id="playerVideo" playsinline webkit-playsinline preload="metadata"></video>

    <div class="loading-ring" id="loadingRing"><div class="ring"></div></div>

    <div class="tap-zone paused" id="tapZone">
      <div class="play-btn-wrap">
        <div class="play-triangle" id="playTriangle"></div>
        <div class="pause-bars" id="pauseBars" style="display:none">
          <div class="pause-bar"></div><div class="pause-bar"></div>
        </div>
      </div>
    </div>

    <div class="player-top">
      <button class="player-back-btn" id="playerBackBtn" type="button">
        &#8592; Videos
      </button>
      <div class="player-vid-title" id="playerVidTitle">Loading...</div>
    </div>
  </div>

  <script>
    // ── Video list ──────────────────────────────────────────────────────────
    const breakVideos = [
      { title: "Toy Story Freeze Dance",    icon: "🤠", file: "videos/toy-story-freeze-dance.mp4" },
      { title: "PAW Patrol Human Tetris",   icon: "🐾", file: "videos/paw-patrol-human-tetris.mp4" },
      { title: "SuperKitties Dance Off",    icon: "🐱", file: "videos/superkitties-dance-off.mp4" },
      { title: "Bluey Summer Freeze Dance", icon: "☀️", file: "videos/bluey-summer-freeze-dance.mp4" },
      { title: "Stitch Freeze Dance",       icon: "🌊", file: "videos/stitch-freeze-dance.mp4" },
    ];

    // ── Elements ────────────────────────────────────────────────────────────
    const menuScreen   = document.getElementById("menuScreen");
    const rotateScreen = document.getElementById("rotateScreen");
    const playerScreen = document.getElementById("playerScreen");
    const cardStack    = document.getElementById("cardStack");
    const playerVideo  = document.getElementById("playerVideo");
    const tapZone      = document.getElementById("tapZone");
    const playTriangle = document.getElementById("playTriangle");
    const pauseBars    = document.getElementById("pauseBars");
    const loadingRing  = document.getElementById("loadingRing");
    const playerVidTitle = document.getElementById("playerVidTitle");

    let pendingVideoIndex = null;

    // ── Build menu cards ────────────────────────────────────────────────────
    breakVideos.forEach((v, i) => {
      const card = document.createElement("button");
      card.type = "button";
      card.className = `vid-card card-${i}`;
      card.innerHTML = `
        <span class="card-icon">${v.icon}</span>
        <div class="card-text">
          <div class="card-name">${v.title}</div>
          <div class="card-hint">Tap to play</div>
        </div>
        <span class="card-arrow">&#8250;</span>
      `;
      card.addEventListener("click", () => onCardTap(i));
      cardStack.appendChild(card);
    });

    // ── Card tap: rotate prompt or straight to player ───────────────────────
    function isLandscape() {
      return window.matchMedia("(orientation: landscape)").matches;
    }

    function onCardTap(index) {
      pendingVideoIndex = index;
      if (isLandscape()) {
        openPlayer(index);
      } else {
        showScreen(rotateScreen);
        // Auto-advance when they rotate
        const mq = window.matchMedia("(orientation: landscape)");
        function onRotate(e) {
          if (e.matches) {
            mq.removeEventListener("change", onRotate);
            openPlayer(pendingVideoIndex);
          }
        }
        mq.addEventListener("change", onRotate);
      }
    }

    // Back button on rotate screen returns to menu
    document.getElementById("rotateBackBtn").addEventListener("click", () => {
      pendingVideoIndex = null;
      showScreen(menuScreen);
    });

    // "Play anyway" skips rotation
    document.getElementById("rotateCancelBtn").addEventListener("click", () => {
      openPlayer(pendingVideoIndex);
    });

    // ── Navigation ──────────────────────────────────────────────────────────
    document.getElementById("menuHomeBtn").addEventListener("click", () => {
      window.location.href = "index.html";
    });

    document.getElementById("playerBackBtn").addEventListener("click", () => {
      playerVideo.pause();
      playerVideo.src = "";
      showScreen(menuScreen);
    });

    function showScreen(screen) {
      [menuScreen, rotateScreen, playerScreen].forEach(s => s.classList.remove("active"));
      screen.classList.add("active");
    }

    // ── Player ──────────────────────────────────────────────────────────────
    function openPlayer(index) {
      try { screen.orientation.lock("landscape").catch(() => {}); } catch(e) {}
      const v = breakVideos[index];
      showScreen(playerScreen);
      playerVidTitle.textContent = v.title;
      setPlayState("loading");
      playerVideo.src = v.file;
      playerVideo.load();
    }

    function setPlayState(state) {
      if (state === "loading") {
        loadingRing.classList.add("visible");
        tapZone.className = "tap-zone paused";
        playTriangle.style.display = "";
        pauseBars.style.display = "none";
      } else if (state === "playing") {
        loadingRing.classList.remove("visible");
        tapZone.className = "tap-zone playing";
        playTriangle.style.display = "none";
        pauseBars.style.display = "flex";
      } else {
        loadingRing.classList.remove("visible");
        tapZone.className = "tap-zone paused";
        playTriangle.style.display = "";
        pauseBars.style.display = "none";
      }
    }

    tapZone.addEventListener("click", () => {
      if (playerVideo.paused || playerVideo.ended) {
        playerVideo.play().catch(() => {});
      } else {
        playerVideo.pause();
      }
    });

    playerVideo.addEventListener("canplay", () => {
      setPlayState("paused");
      playerVideo.play().catch(() => {});
    });
    playerVideo.addEventListener("playing", () => setPlayState("playing"));
    playerVideo.addEventListener("pause",   () => setPlayState("paused"));
    playerVideo.addEventListener("waiting", () => loadingRing.classList.add("visible"));
    playerVideo.addEventListener("ended",   () => setPlayState("paused"));
    playerVideo.addEventListener("error",   () => {
      setPlayState("paused");
      playerVidTitle.textContent = "Could not load video";
    });
  </script>
</body>
</html>
