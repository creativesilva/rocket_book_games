<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Brain Break" />
  <meta name="theme-color" content="#0d0d20" />
  <link rel="apple-touch-icon" href="rocket_book_logo.png?v=12" />
  <title>Brain Break</title>
  <style>
    :root {
      --safe-top:    max(14px, env(safe-area-inset-top));
      --safe-bottom: max(14px, env(safe-area-inset-bottom));
      --safe-left:   max(20px, env(safe-area-inset-left));
      --safe-right:  max(20px, env(safe-area-inset-right));
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      width: 100%; height: 100%;
      background: #0d0d20;
      overflow: hidden;
      touch-action: manipulation;
      -webkit-user-select: none; user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Screen system ─────────────────────────────────────────────────── */
    .screen {
      position: fixed; inset: 0;
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
    }
    .screen.active { display: flex; }

    /* ═══════════════════════════════════════════════════════════════════
       MENU SCREEN — works in portrait and landscape
    ═══════════════════════════════════════════════════════════════════ */
    #menuScreen {
      background:
        radial-gradient(ellipse at 20% 10%,  rgba(139,92,246,0.38), transparent 55%),
        radial-gradient(ellipse at 80% 15%,  rgba(59,130,246,0.28), transparent 50%),
        radial-gradient(ellipse at 10% 90%,  rgba(236,72,153,0.22), transparent 45%),
        radial-gradient(ellipse at 85% 80%,  rgba(6,182,212,0.22),  transparent 40%),
        #0d0d20;
      padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
      gap: 0;
    }

    .menu-back-btn {
      position: absolute;
      top: var(--safe-top); left: var(--safe-left);
      width: 36px; height: 36px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.20);
      border-radius: 50%; color: #fff;
      font-size: 18px; display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    }
    .menu-back-btn:active { background: rgba(255,255,255,0.24); transform: scale(0.92); }

    .menu-heading {
      text-align: center;
      margin-bottom: clamp(14px, 3vh, 28px);
    }
    .menu-title {
      font-size: clamp(24px, 5vw, 34px);
      font-weight: 900; color: #fff;
      letter-spacing: -0.5px; line-height: 1.1;
    }
    .menu-sub {
      font-size: 13px; font-weight: 600;
      color: rgba(255,255,255,0.42);
      text-transform: uppercase; letter-spacing: 0.06em;
      margin-top: 5px;
    }

    /* Vertical card stack, centered */
    .card-stack {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: clamp(8px, 1.6vh, 14px);
      width: 100%; max-width: 440px;
    }

    .vid-card {
      width: 100%;
      border-radius: 18px;
      padding: 14px 18px;
      display: flex; flex-direction: row;
      align-items: center; gap: 16px;
      cursor: pointer;
      position: relative; overflow: hidden;
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: 0 6px 22px rgba(0,0,0,0.32), inset 0 1px 0 rgba(255,255,255,0.22);
      transition: transform 0.13s ease, box-shadow 0.13s ease;
    }
    .vid-card:active { transform: scale(0.96); box-shadow: 0 3px 10px rgba(0,0,0,0.28); }
    .vid-card::before {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.16) 0%, transparent 55%);
    }

    .card-icon {
      font-size: clamp(30px, 5vw, 40px);
      line-height: 1; flex-shrink: 0;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.22));
      position: relative; z-index: 1;
    }
    .card-text {
      flex: 1; min-width: 0;
      position: relative; z-index: 1;
    }
    .card-name {
      font-size: clamp(14px, 2.5vw, 17px);
      font-weight: 800; color: #fff;
      line-height: 1.2;
    }
    .card-hint {
      font-size: 12px; font-weight: 600;
      color: rgba(255,255,255,0.55);
      margin-top: 2px;
    }
    .card-arrow {
      font-size: 20px; color: rgba(255,255,255,0.55);
      flex-shrink: 0; position: relative; z-index: 1;
    }

    /* Card colors */
    .card-0 { background: linear-gradient(145deg, #f59e0b, #b45309); }
    .card-1 { background: linear-gradient(145deg, #60a5fa, #1d4ed8); }
    .card-2 { background: linear-gradient(145deg, #f472b6, #be185d); }
    .card-3 { background: linear-gradient(145deg, #34d399, #047857); }
    .card-4 { background: linear-gradient(145deg, #67e8f9, #0e7490); }
    .card-5 { background: linear-gradient(145deg, #a3a3f5, #4f46e5); }
    .card-6 { background: linear-gradient(145deg, #fb923c, #c2410c); }

    /* ═══════════════════════════════════════════════════════════════════
       ROTATE PROMPT SCREEN
    ═══════════════════════════════════════════════════════════════════ */
    #rotateScreen {
      background: #0d0d20;
      gap: 0;
    }

    .rotate-icon {
      font-size: 64px;
      animation: tilt 2s ease-in-out infinite;
      margin-bottom: 20px;
    }
    @keyframes tilt {
      0%,100% { transform: rotate(0deg); }
      35%,65%  { transform: rotate(90deg); }
    }
    .rotate-title {
      font-size: 26px; font-weight: 900;
      color: #fff; margin-bottom: 8px; text-align: center;
    }
    .rotate-sub {
      font-size: 15px; color: rgba(255,255,255,0.48);
      text-align: center; margin-bottom: 32px;
    }
    .rotate-play-btn {
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.24);
      border-radius: 50px;
      padding: 12px 28px;
      color: rgba(255,255,255,0.60);
      font-family: inherit; font-size: 15px; font-weight: 700;
      cursor: pointer;
    }
    .rotate-play-btn:active { background: rgba(255,255,255,0.20); }

    /* ═══════════════════════════════════════════════════════════════════
       PLAYER SCREEN
    ═══════════════════════════════════════════════════════════════════ */
    #playerScreen {
      background: #000;
      justify-content: flex-start;
    }

    #playerVideo {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: contain;
      background: #000;
    }

    /* Invisible full-screen tap area */
    .video-tap {
      position: absolute; inset: 0; z-index: 5; cursor: pointer;
    }

    /* Controls overlay: fades in/out */
    .player-ui {
      position: absolute; inset: 0; z-index: 10;
      pointer-events: none; opacity: 0;
      transition: opacity 0.26s ease;
    }
    .player-ui.visible { opacity: 1; }
    .player-ui.visible .player-top-bar,
    .player-ui.visible .player-btm-bar { pointer-events: auto; }

    /* Top gradient bar */
    .player-top-bar {
      position: absolute; top: 0; left: 0; right: 0;
      padding: max(var(--safe-top), 14px) var(--safe-right) 52px var(--safe-left);
      background: linear-gradient(180deg, rgba(0,0,0,0.76) 0%, transparent 100%);
      display: flex; align-items: flex-end; gap: 10px;
    }
    .player-back-btn {
      display: flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,0.13);
      border: 1px solid rgba(255,255,255,0.24);
      border-radius: 50px; padding: 7px 14px 7px 10px;
      color: #fff; font-size: 14px; font-weight: 700;
      cursor: pointer; font-family: inherit; flex-shrink: 0;
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      transition: background 0.12s;
    }
    .player-back-btn:active { background: rgba(255,255,255,0.28); }
    .player-vid-title {
      font-size: 13px; font-weight: 700;
      color: rgba(255,255,255,0.82);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      min-width: 0;
    }

    /* Bottom gradient bar */
    .player-btm-bar {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 52px var(--safe-right) max(var(--safe-bottom), 18px) var(--safe-left);
      background: linear-gradient(0deg, rgba(0,0,0,0.82) 0%, transparent 100%);
    }

    /* Progress row */
    .prog-row {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 14px;
    }
    .prog-track {
      flex: 1; height: 4px; position: relative;
      background: rgba(255,255,255,0.28); border-radius: 2px;
      cursor: pointer; touch-action: none;
      padding: 10px 0; margin: -10px 0; box-sizing: content-box;
    }
    .prog-fill {
      position: absolute; top: 0; left: 0; bottom: 0;
      background: #fff; border-radius: 2px;
      width: 0%; pointer-events: none;
    }
    .prog-thumb {
      position: absolute; top: 50%; left: 0;
      width: 14px; height: 14px; border-radius: 50%; background: #fff;
      transform: translate(-50%, -50%);
      box-shadow: 0 1px 5px rgba(0,0,0,0.4); pointer-events: none;
    }
    .prog-time {
      font-size: 13px; font-weight: 700; white-space: nowrap; flex-shrink: 0;
      color: rgba(255,255,255,0.86); font-feature-settings: "tnum";
    }
    .prog-sep { color: rgba(255,255,255,0.44); }

    /* Controls row */
    .ctrl-row {
      display: flex; align-items: center; justify-content: center; gap: 18px;
    }
    .ctrl-btn {
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 50%; color: #fff; cursor: pointer;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      transition: background 0.12s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    .ctrl-btn:active { background: rgba(255,255,255,0.28); transform: scale(0.90); }
    .skip-btn { width: 52px; height: 52px; gap: 1px; }
    .skip-lbl { font-size: 10px; font-weight: 800; letter-spacing: 0.02em; line-height: 1; }
    .pp-btn { width: 68px; height: 68px; }

    /* Loading spinner */
    .loading-ring {
      position: absolute; inset: 0; z-index: 4;
      display: none; align-items: center; justify-content: center;
      pointer-events: none;
    }
    .loading-ring.visible { display: flex; }
    .ring {
      width: 48px; height: 48px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: rgba(255,255,255,0.80);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Video complete overlay */
    .done-overlay {
      display: none; position: absolute; inset: 0; z-index: 20;
      background: rgba(0,0,0,0.84);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; text-align: center;
      padding: max(var(--safe-top), 24px) 32px max(var(--safe-bottom), 24px);
    }
    .done-overlay.show { display: flex; }
    .done-emoji { font-size: 60px; line-height: 1; }
    .done-title { font-size: 26px; font-weight: 900; color: #fff; line-height: 1.1; }
    .done-sub {
      font-size: 14px; color: rgba(255,255,255,0.58);
      max-width: 290px; line-height: 1.45; margin-top: 2px;
    }
    .done-back-btn {
      margin-top: 12px;
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.26);
      border-radius: 50px; padding: 13px 32px;
      color: #fff; font-size: 17px; font-weight: 700;
      cursor: pointer; font-family: inherit;
    }
    .done-back-btn:active { background: rgba(255,255,255,0.24); }
  </style>
  <link rel="stylesheet" href="mobile-fixes.css?v=20261001-ipad" />
</head>
<body>

  <!-- ── MENU SCREEN ─────────────────────────────────────────────────── -->
  <div class="screen active" id="menuScreen">
    <button class="menu-back-btn" id="menuHomeBtn" type="button" aria-label="Home">&#8592;</button>

    <div class="menu-heading">
      <div class="menu-title">&#x1F3AC; Brain Break</div>
      <div class="menu-sub">Pick a video and dance!</div>
    </div>

    <div class="card-stack" id="cardStack"></div>
  </div>

  <!-- ── ROTATE PROMPT SCREEN ────────────────────────────────────────── -->
  <div class="screen" id="rotateScreen">
    <button class="menu-back-btn" id="rotateBackBtn" type="button" aria-label="Back to menu">&#8592;</button>
    <div class="rotate-icon">&#x1F4F1;</div>
    <div class="rotate-title">Turn it sideways!</div>
    <div class="rotate-sub">Rotate your device to landscape<br>for the best view.</div>
    <button class="rotate-play-btn" id="rotateCancelBtn" type="button">Play anyway</button>
  </div>

  <!-- ── PLAYER SCREEN ───────────────────────────────────────────────── -->
  <div class="screen" id="playerScreen">
    <video id="playerVideo" playsinline webkit-playsinline preload="metadata"></video>
    <div class="loading-ring" id="loadingRing"><div class="ring"></div></div>

    <div class="video-tap" id="videoTap"></div>

    <div class="player-ui" id="playerUI">
      <div class="player-top-bar">
        <button class="player-back-btn" id="playerBackBtn" type="button">
          <svg width="9" height="15" viewBox="0 0 9 15" fill="none"><path d="M8 1L1 7.5L8 14" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Videos
        </button>
        <div class="player-vid-title" id="playerVidTitle"></div>
      </div>

      <div class="player-btm-bar">
        <div class="prog-row">
          <div class="prog-track" id="progTrack">
            <div class="prog-fill" id="progFill"></div>
            <div class="prog-thumb" id="progThumb"></div>
          </div>
          <div class="prog-time">
            <span id="timeCur">0:00</span><span class="prog-sep"> / </span><span id="timeTot">0:00</span>
          </div>
        </div>
        <div class="ctrl-row">
          <button class="ctrl-btn skip-btn" id="skipBackBtn" type="button" aria-label="Back 10 seconds">
            <svg width="22" height="22" viewBox="0 0 24 24"><path d="M11.99 5V1l-5 5 5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6h-2c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z" fill="white"/></svg>
            <span class="skip-lbl">10</span>
          </button>
          <button class="ctrl-btn pp-btn" id="ppBtn" type="button" aria-label="Play or Pause">
            <svg id="iconPlay" width="28" height="28" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="white"/></svg>
            <svg id="iconPause" width="28" height="28" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" fill="white"/></svg>
          </button>
          <button class="ctrl-btn skip-btn" id="skipFwdBtn" type="button" aria-label="Forward 10 seconds">
            <svg width="22" height="22" viewBox="0 0 24 24"><path d="M18 13c0 3.31-2.69 6-6 6s-6-2.69-6-6 2.69-6 6-6v4l5-5-5-5v4c-4.42 0-8 3.58-8 8s3.58 8 8 8 8-3.58 8-8h-2z" fill="white"/></svg>
            <span class="skip-lbl">10</span>
          </button>
        </div>
      </div>
    </div>

    <div class="done-overlay" id="doneOverlay">
      <div class="done-emoji">&#x1F389;</div>
      <div class="done-title">Brain Break Complete!</div>
      <div class="done-sub">Complete another learning game to unlock the next brain break.</div>
      <button class="done-back-btn" id="doneDismiss" type="button">Back to Menu</button>
    </div>
  </div>

  <script>
    // Bounce to home if brain break is not yet unlocked
    if (localStorage.getItem("rocketBreakUnlocked") !== "1") {
      window.location.replace("index.html");
    }

    // ── Video list ──────────────────────────────────────────────────────────
    const breakVideos = [
      { title: "Toy Story Freeze Dance",    icon: "🤠", file: "videos/toy-story-freeze-dance.mp4" },
      { title: "PAW Patrol Human Tetris",   icon: "🐾", file: "videos/paw-patrol-human-tetris.mp4" },
      { title: "SuperKitties Dance Off",    icon: "🐱", file: "videos/superkitties-dance-off.mp4" },
      { title: "Bluey Summer Freeze Dance", icon: "☀️", file: "videos/bluey-summer-freeze-dance.mp4" },
      { title: "Stitch Freeze Dance",       icon: "🌊", file: "videos/stitch-freeze-dance.mp4" },
      { title: "Sonic Freeze Dance",        icon: "🔵", file: "videos/sonic-freeze-dance.mp4" },
      { title: "Mario Freeze Dance",        icon: "🍄", file: "videos/mario-freeze-dance.mp4" },
    ];

    // ── Element refs ────────────────────────────────────────────────────────
    const menuScreen   = document.getElementById("menuScreen");
    const rotateScreen = document.getElementById("rotateScreen");
    const playerScreen = document.getElementById("playerScreen");
    const cardStack    = document.getElementById("cardStack");
    const playerVideo  = document.getElementById("playerVideo");
    const loadingRing  = document.getElementById("loadingRing");
    const playerUI     = document.getElementById("playerUI");
    const videoTap     = document.getElementById("videoTap");
    const progTrack    = document.getElementById("progTrack");
    const progFill     = document.getElementById("progFill");
    const progThumb    = document.getElementById("progThumb");
    const timeCur      = document.getElementById("timeCur");
    const timeTot      = document.getElementById("timeTot");
    const ppBtn        = document.getElementById("ppBtn");
    const iconPlay     = document.getElementById("iconPlay");
    const iconPause    = document.getElementById("iconPause");
    const doneOverlay  = document.getElementById("doneOverlay");

    let pendingVideoIndex = null;
    let hideTimer = null;

    // ── Build menu cards ────────────────────────────────────────────────────
    breakVideos.forEach((v, i) => {
      const card = document.createElement("button");
      card.type = "button";
      card.className = `vid-card card-${i}`;
      card.innerHTML = `
        <span class="card-icon">${v.icon}</span>
        <div class="card-text">
          <div class="card-name">${v.title}</div>
          <div class="card-hint">Tap to play</div>
        </div>
        <span class="card-arrow">&#8250;</span>
      `;
      card.addEventListener("click", () => onCardTap(i));
      cardStack.appendChild(card);
    });

    // ── Screen navigation ───────────────────────────────────────────────────
    function showScreen(screen) {
      [menuScreen, rotateScreen, playerScreen].forEach(s => s.classList.remove("active"));
      screen.classList.add("active");
    }

    function isLandscape() {
      return window.matchMedia("(orientation: landscape)").matches;
    }

    function onCardTap(index) {
      pendingVideoIndex = index;
      if (isLandscape()) {
        openPlayer(index);
      } else {
        showScreen(rotateScreen);
        const mq = window.matchMedia("(orientation: landscape)");
        function onRotate(e) {
          if (e.matches) { mq.removeEventListener("change", onRotate); openPlayer(pendingVideoIndex); }
        }
        mq.addEventListener("change", onRotate);
      }
    }

    document.getElementById("rotateBackBtn").addEventListener("click", () => {
      pendingVideoIndex = null; showScreen(menuScreen);
    });
    document.getElementById("rotateCancelBtn").addEventListener("click", () => {
      openPlayer(pendingVideoIndex);
    });
    document.getElementById("menuHomeBtn").addEventListener("click", () => {
      window.location.href = "index.html";
    });

    // ── Open player ─────────────────────────────────────────────────────────
    function openPlayer(index) {
      try { screen.orientation.lock("landscape").catch(() => {}); } catch(e) {}
      const v = breakVideos[index];
      showScreen(playerScreen);
      document.getElementById("playerVidTitle").textContent = v.title;
      doneOverlay.classList.remove("show");
      loadingRing.classList.add("visible");
      playerUI.classList.remove("visible");
      timeCur.textContent = "0:00";
      timeTot.textContent = "0:00";
      progFill.style.width = "0%";
      progThumb.style.left = "0%";
      playerVideo.src = v.file;
      playerVideo.load();
    }

    document.getElementById("playerBackBtn").addEventListener("click", () => {
      clearTimeout(hideTimer);
      playerVideo.pause();
      playerVideo.src = "";
      showScreen(menuScreen);
    });

    // ── Controls auto-hide ──────────────────────────────────────────────────
    function showUI(autoHide) {
      playerUI.classList.add("visible");
      clearTimeout(hideTimer);
      if (autoHide && !playerVideo.paused && !playerVideo.ended) {
        hideTimer = setTimeout(() => playerUI.classList.remove("visible"), 3200);
      }
    }

    // ── Tap zone ────────────────────────────────────────────────────────────
    videoTap.addEventListener("click", () => {
      if (!playerUI.classList.contains("visible")) {
        showUI(!playerVideo.paused);
      } else {
        togglePlay();
      }
    });

    function togglePlay() {
      if (playerVideo.paused || playerVideo.ended) {
        playerVideo.play().catch(() => {});
      } else {
        playerVideo.pause();
      }
    }

    // ── Play/Pause button ───────────────────────────────────────────────────
    ppBtn.addEventListener("click", e => {
      e.stopPropagation(); togglePlay(); showUI(true);
    });

    function updatePPIcon() {
      const playing = !playerVideo.paused && !playerVideo.ended;
      iconPlay.style.display  = playing ? "none" : "";
      iconPause.style.display = playing ? "" : "none";
    }

    // ── Skip buttons ────────────────────────────────────────────────────────
    document.getElementById("skipBackBtn").addEventListener("click", e => {
      e.stopPropagation();
      playerVideo.currentTime = Math.max(0, playerVideo.currentTime - 10);
      showUI(true);
    });
    document.getElementById("skipFwdBtn").addEventListener("click", e => {
      e.stopPropagation();
      const dur = playerVideo.duration;
      playerVideo.currentTime = Math.min(isFinite(dur) ? dur : 0, playerVideo.currentTime + 10);
      showUI(true);
    });

    // ── Progress bar ────────────────────────────────────────────────────────
    function fmtTime(s) {
      if (!isFinite(s) || s < 0) return "0:00";
      return Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
    }

    function syncProgress() {
      const dur = playerVideo.duration;
      if (!dur || !isFinite(dur)) return;
      const pct = (playerVideo.currentTime / dur) * 100;
      progFill.style.width = pct + "%";
      progThumb.style.left = pct + "%";
      timeCur.textContent = fmtTime(playerVideo.currentTime);
    }

    function seekFromPointer(e) {
      const rect = progTrack.getBoundingClientRect();
      const x = ((e.touches ? e.touches[0].clientX : e.clientX) - rect.left) / rect.width;
      const dur = playerVideo.duration;
      if (dur && isFinite(dur)) {
        playerVideo.currentTime = Math.min(1, Math.max(0, x)) * dur;
      }
      syncProgress();
    }

    let scrubbing = false;
    progTrack.addEventListener("mousedown",  e => { scrubbing = true; seekFromPointer(e); });
    progTrack.addEventListener("touchstart", e => { scrubbing = true; seekFromPointer(e); showUI(false); }, { passive: true });
    document.addEventListener("mousemove",  e => { if (scrubbing) seekFromPointer(e); });
    document.addEventListener("touchmove",  e => { if (scrubbing) seekFromPointer(e); }, { passive: true });
    document.addEventListener("mouseup",    () => { scrubbing = false; });
    document.addEventListener("touchend",   () => { scrubbing = false; });

    // ── Video events ────────────────────────────────────────────────────────
    playerVideo.addEventListener("loadedmetadata", () => {
      timeTot.textContent = fmtTime(playerVideo.duration);
    });
    playerVideo.addEventListener("canplay", () => {
      loadingRing.classList.remove("visible");
      syncProgress();
      playerVideo.play().catch(() => {});
    });
    playerVideo.addEventListener("playing", () => {
      updatePPIcon();
      showUI(true);
      loadingRing.classList.remove("visible");
    });
    playerVideo.addEventListener("pause", () => {
      updatePPIcon();
      clearTimeout(hideTimer);
      playerUI.classList.add("visible");
    });
    playerVideo.addEventListener("waiting", () => loadingRing.classList.add("visible"));
    playerVideo.addEventListener("timeupdate", syncProgress);
    playerVideo.addEventListener("ended", () => {
      updatePPIcon();
      clearTimeout(hideTimer);
      playerUI.classList.remove("visible");
      localStorage.removeItem("rocketBreakUnlocked");
      doneOverlay.classList.add("show");
    });
    playerVideo.addEventListener("error", () => {
      loadingRing.classList.remove("visible");
      document.getElementById("playerVidTitle").textContent = "Could not load video";
    });

    document.getElementById("doneDismiss").addEventListener("click", () => {
      doneOverlay.classList.remove("show");
      playerVideo.pause();
      playerVideo.src = "";
      showScreen(menuScreen);
    });
  </script>
</body>
</html>
